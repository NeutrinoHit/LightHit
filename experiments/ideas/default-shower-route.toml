id = "default-shower-route"
title = "Shower route: lighthit.shower.ShowerTransport"
area = "routes"
question = "What does the default shower route cost, and what does it give, on standard showers?"
kind = "route"
status = "default"
verdict = "Against reference-shower at 1 thread: 100 GeV electron order-1 bias -0.50%, L1 1.14%, order >=2 L1 0.31%, total L1 0.39% in 14.4 s; 100 GeV pi+ order-1 L1 10.6%, order >=2 L1 0.044%, total L1 3.5% in 20.7 s; nu_e CC order-1 L1 2.3%, total L1 0.78% in 13.8 s; order 0 is exact on all three."
cases = [
  "default-shower-route/electron-100GeV",
  "default-shower-route/nue-cc",
  "default-shower-route/pion-100GeV",
]
how-to-run = """
PYTHONPATH=src python experiments/run.py run 'default-shower-route/*' (add --threads default for all cores)
"""
inputs = [
  "bundle: model/bgvd-model.npz, tables/rte-cache, tables/ge2-pack, tables/muon-data.json",
  """
bundle: events/geant4-electron-100GeV.h5 (event 5, placed as in notebooks/lighthit-standalone.ipynb)
""",
  "regenerated: pion-100GeV, nue-cc (experiments/regenerate_inputs.py)",
]
notes = [
  "Executed functions: docs/usage-map.md (scenarios shower, ntsim-electron, ntsim-nue-cc).",
  """
Accuracy is measured against reference-shower (original-step orders 0 and 1, per-band order >=2) on the OMs of this route.
""",
]

[code]
modules = [
  "lighthit.shower.api",
  "lighthit.shower.ge2",
  "lighthit.shower.data",
  "lighthit.band_fold",
  "lighthit.shower_basis",
  "lighthit._shower_basis",
  "lighthit.prompt",
  "lighthit._prompt_numba",
  "lighthit.ballistic_interval",
  "lighthit._ballistic_interval_numba",
]
functions = ["ShowerTransport.__call__", "transport_shower"]
options = [
  """
ShowerConfig() defaults: ShowerBasis(), PromptConfig(ballistic_method='interval', fuse_bands=True, fused_pixel_face=96, fused_ring_nodes=192), frequency_nodes=65, band_rank=3
""",
]
scripts = []
tests = ["tests/test_shower_route.py"]

