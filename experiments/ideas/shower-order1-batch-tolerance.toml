id = "shower-order1-batch-tolerance"
title = "Omit grouped order-1 batches below an analytic charge estimate"
area = "shower"
question = """
What does batch_charge_tolerance_pe=1e-3 save on showers and what does it cost in accuracy?
"""
kind = "alternative-option"
status = "rejected"
verdict = "batch_charge_tolerance_pe = 1e-3 leaves every metric identical to the default on both showers (electron order-1 bias -0.504%, L1 1.14%; pion L1 10.6%) and is slower: 1.83x (electron) and 1.41x (pion) the default wall time."
baseline = "default-shower-route"
cases = [
  "shower-order1-batch-tolerance/electron-100GeV-1e-3",
  "shower-order1-batch-tolerance/pion-100GeV-1e-3",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'shower-order1-batch-tolerance/*'"
inputs = [
  "bundle Geant4 100 GeV electron (event 5)",
  "regenerated pion-100GeV",
  """
reference-shower/<input> (original-step orders 0+1, per-band order >=2, on the OMs of the default route)
""",
]
notes = []

[code]
modules = ["lighthit.prompt", "lighthit._prompt_numba"]
functions = []
options = [
  """
PromptConfig.batch_charge_tolerance_pe (default 0; NTSim --hybrid-prompt-batch-tolerance-pe)
""",
]
scripts = []
tests = []

