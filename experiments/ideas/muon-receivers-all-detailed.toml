area = "muon"
question = """
How much of the muon route's difference to the reference comes from the preview/selection rather than the fine physics?
"""
kind = "probe"
status = "tool"
verdict = "Computing the default run's 41 (1 TeV) and 30 (300 GeV) OMs in detail without preview or selection reproduces the default charges on all active OMs to 5e-15 and 1.1e-12 relative; the differences to the default are on sub-threshold OMs only; it takes 0.59x and 0.52x the default wall time because it computes those OMs only."
baseline = "default-muon-route"
cases = [
  "muon-receivers-all-detailed/muon-1TeV",
  "muon-receivers-all-detailed/muon-300GeV",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'muon-receivers-all-detailed/*'"
inputs = [
  "bundle 1 TeV muon + ancestry",
  "regenerated 300 GeV muon (bit-identical regeneration checked on the 1 TeV event)",
  """
reference-muon/<input> (orders 0+1 of all original steps by the grouped per-band prompt without screen, order >=2 per band cloud-in-cell, on the OMs of the default route)
""",
]
notes = []

