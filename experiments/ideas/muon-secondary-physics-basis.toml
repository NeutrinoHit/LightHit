id = "muon-secondary-physics-basis"
title = """
Physical basis of the secondary light (category x angle x spectrum) and its transfer across energies
"""
area = "muon"
question = """
Can the secondaries' angular light be described by a few templates (or a positive cone mixture) that transfer between 300, 1000 and 3000 GeV?
"""
kind = "probe"
status = "open"
verdict = "Held-out transfer of six physical angular templates gives L1 9.7%, 5.0% and 8.3% at 300, 1000 and 3000 GeV (one template: 16.8%, 12.2%, 12.1%); the positive cone mixture with 55 functions gives weighted L1 6.7%, 8.3% and 3.5%."
cases = [
  "muon-secondary-physics-basis/angle-300",
  "muon-secondary-physics-basis/angle-40",
  "muon-secondary-physics-basis/cone-mixture",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'muon-secondary-physics-basis/*'"
inputs = [
  "bundle 1 TeV muon (= the old muon1000.npz, sha256 e472ed6b...) and ancestry",
  """
regenerated 300 and 3000 GeV muons (same generator and seed as benchmark_long_muon.py generate; analyze_muon_secondaries.py --capture-source confirmed identical steps)
""",
]
notes = [
  """
No route uses a template or cone-mixture source; the muon route keeps the original steps (joint sources).
""",
  """
The idea did not enter the code; the measured template errors are below.
""",
]

[code]
modules = []
functions = []
options = []
scripts = [
  "scripts/shower_basis/probe_secondary_physics_basis.py",
  "scripts/shower_basis/probe_cone_mixture_basis.py",
]
tests = []

