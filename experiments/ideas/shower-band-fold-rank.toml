id = "shower-band-fold-rank"
title = "Number of node bands of the band fold (order >=2 compiled in rank bands)"
area = "shower"
question = "Accuracy and cost of the band fold with 2, 3 (default), 4 and 9 node bands."
kind = "alternative-option"
status = "default"
verdict = "With 2, 4 or 9 node bands instead of 3, order >=2 L1 against reference-shower changes only in the fourth digit (electron 0.3085%, 0.3088%, 0.3078% vs 0.3088%; pion 0.0438%, 0.0441%, 0.0435% vs 0.0439%); wall 0.99x/1.08x/1.38x (electron) and 0.86x/1.14x/1.85x (pion)."
baseline = "default-shower-route"
cases = [
  "shower-band-fold-rank/electron-100GeV-rank-2",
  "shower-band-fold-rank/electron-100GeV-rank-4",
  "shower-band-fold-rank/electron-100GeV-rank-9",
  "shower-band-fold-rank/pion-100GeV-rank-2",
  "shower-band-fold-rank/pion-100GeV-rank-4",
  "shower-band-fold-rank/pion-100GeV-rank-9",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'shower-band-fold-rank/*'"
inputs = [
  "bundle Geant4 100 GeV electron (event 5)",
  "regenerated pion-100GeV",
  """
reference-shower/<input> (original-step orders 0+1, per-band order >=2, on the OMs of the default route)
""",
]
notes = []

[code]
modules = ["lighthit.band_fold", "lighthit.shower.ge2"]
functions = []
options = ["ShowerConfig.band_rank=3 (default), 1..9"]
scripts = []
tests = ["tests/test_shower_route.py"]

