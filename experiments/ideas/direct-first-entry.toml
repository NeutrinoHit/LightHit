id = "direct-first-entry"
title = "Direct glass-entry response with a bounded control-variate residual"
area = "ballistic"
question = "Can the original spectral steps reach the first glass entry at the existing numerical tolerance without losing the fast event route?"
kind = "validation"
status = "open"
verdict = "Bounded full-pair omission and optical-panel reuse reduce the explicit glass-entry event from the previous 19.30 s to 14.93 s. A paired current fast route is 10.05 s on the same Mac, one thread. Numerical tolerance and the fast response are preserved; the no-slowdown requirement remains unmet."
cases = ["direct-first-entry/axial-sphere", "direct-first-entry/path-moment-window"]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'direct-first-entry/*'"
inputs = ["analytic axial cone, constant phase/group index and efficiency; supplied sphere radius 0.2 m independent of area", "two finite dispersive windows, beta=0.9, tilted cubic angular acceptance, supplied radius 0.126 m; independent wavelength/source/azimuth quadrature at orders 32 and 64"]
notes = [
  "Charge analytically integrates the first path and curvature moments over each actual partial source window; bins retain the finite-disk CDF. The numerical residual uses actual first-entry paths and receiver orientation, with charge/bin-L1 convergence per OM.",
  "Residual omission uses geometry bounds, including time-distribution total variation for bins. It uses no event scaling, distance switch or fixed clock shift.",
  "One e100GeV event with 42194 steps and 1440 OMs retained 27 active OMs and bitwise unchanged scattered components. Direct charge changed by about +1.01%; this is an addressed comparison, not a new full MC matrix.",
  "Residual orders 3/6/3 reduced the earlier 25.0 s event to 20.8 s at the same tolerance. Direct positive bin integration without a disk control needed order 8/16/6 for the addressed receivers and was slower; it was rejected.",
  "With path moments, the charge residual keeps 37066 of 311850 pairs rather than about 60000. Reusing prepared optical-window cuts reduces charge-stage cost to 5.82 s versus 6.25 s for the cone control; full-event time improves only modestly. Five independent controls use at most 0.021 of the unchanged error tolerance.",
  "The default fast response was checked bitwise against its saved charge, bins, spectrum, selection and origins. First-scattering tables and order >=2 remain a separate open boundary-reference task.",
  "On the exact original MC steps, bounded full-pair omission retains 89550 of 311850 candidates in an all-receiver charge check. Panel charges can enter one bin only after a conservative arrival-time enclosure and a per-OM error-budget check. Insufficient available memory disables this reuse. No physical distance or time threshold was added.",
  "The new paired complete-event measurement on macOS, one thread, is 10.05 s fast and 14.93 s entry; entry charge and bins take 3.19 and 3.40 s. Against the saved entry response, charge and bin-L1 differences use at most 0.047 and 0.038 of the unchanged numerical tolerance. The saved fast response remains bitwise equal. No default route switch is justified.",
  "A fixed-wavelength residual with quadratic source-time cuts was checked on three active receivers. It stays within 0.031 of the numerical tolerance, but takes 1.57 s versus 0.565 s for the existing point/impact residual, so it was not connected to production.",
  "Physical distance accuracy is separate from quadrature tolerance: an addressed comparison on the exact original e100GeV MC steps gives order >=2 at 20-50 m 1.098 +/- 0.029 of 16 saved MC runs (about 3.3 sigma), despite total charge 0.991 +/- 0.014 with direct glass entry. All five independent Q0 controls lie at 25-60 m; farther MC statistics are weaker. See docs/accuracy.md.",
]

[code]
modules = ["lighthit.ballistic_interval", "lighthit._surface_ballistic", "lighthit._surface_ballistic_linear", "lighthit._surface_ballistic_bounds", "lighthit._surface_ballistic_moments"]
functions = ["first_entry_ballistic", "PreparedBallistic", "window_moments", "full_charge_bounds", "single_arrival_bins"]
options = ["explicit API; PromptConfig(ballistic_method='first-entry'); supplied SphereSurface; no default change"]
scripts = []
tests = ["tests/test_ballistic_first_entry.py", "tests/test_ballistic_linear_control.py", "tests/test_ballistic_full_bound.py"]

