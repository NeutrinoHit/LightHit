id = "cone-segment-route"
title = """
Cached cone-segment route: a finite straight Cherenkov segment from multipole tables (lighthit.experimental.cone_segment)
"""
area = "core"
question = """
One cache for any pose of a multi-segment event; invariances, cost and agreement with the coordinate-space reference.
"""
kind = "alternative-option"
status = "superseded-by:default-shower-route"
verdict = "One cache serves any pose: rotation/translation and time-shift invariance hold to 1.4e-14 and segment splitting to 1.0e-7; apply takes about 2.1 s per pose after a 20.2 s build, and order 1 agrees with the coordinate-space reference within 0.66% on nine segment-OM pairs."
cases = [
  "cone-segment-route/benchmark",
  "cone-segment-route/segment-event",
  "cone-segment-route/verify",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'cone-segment-route/*'"
inputs = ["synthetic media and detectors built by the script (no bundle input)"]
notes = []

[code]
modules = [
  "lighthit.experimental.cone_segment",
  "lighthit.experimental.segment_reference",
  "lighthit.experimental.spline_fast",
]
functions = ["ConeSegment", "segment_spectrum", "segment_first_order"]
options = []
scripts = [
  "scripts/run_segment_event.py",
  "scripts/benchmark_route.py",
  "scripts/verify_segment.py",
]
tests = [
  "tests/test_cone_segment.py",
  "tests/test_segment_event.py",
  "tests/test_segment_reference.py",
]

