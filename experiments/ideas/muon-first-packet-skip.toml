id = "muon-first-packet-skip"
title = "Skip secondary packets by a certified order-1 upper bound"
area = "muon"
question = "What does the packet skip (first_skip_epsilon=1e-3) save and change?"
kind = "alternative-option"
status = "default"
verdict = "Disabling the packet skip changes order 1 against reference-muon only in the fourth significant digit (1 TeV bias 2.3167% vs 2.3161%; 300 GeV 3.2353% vs 3.2352%), with the no-skip runs taking 1.15x and 0.99x the default wall time."
baseline = "default-muon-route"
cases = [
  "muon-first-packet-skip/muon-1TeV-no-skip",
  "muon-first-packet-skip/muon-300GeV-no-skip",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'muon-first-packet-skip/*'"
inputs = [
  "bundle 1 TeV muon + ancestry",
  "regenerated 300 GeV muon (bit-identical regeneration checked on the 1 TeV event)",
  """
reference-muon/<input> (orders 0+1 of all original steps by the grouped per-band prompt without screen, order >=2 per band cloud-in-cell, on the OMs of the default route)
""",
]
notes = []

[code]
modules = ["lighthit.muon.packet_skip", "lighthit.muon.secondary_first"]
functions = []
options = [
  "JointMuonConfig.first_skip_epsilon=1e-3, first_skip_seed_fraction=0.5 (defaults)",
]
scripts = []
tests = ["tests/test_packet_skip.py"]

