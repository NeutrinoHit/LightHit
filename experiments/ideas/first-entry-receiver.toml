id = "first-entry-receiver"
title = "Geometry-only first-scattering profiles at the first glass entry"
area = "core"
question = "Can the true receiver boundary be tabulated independently of wavelength while retaining the existing ten angular moments?"
kind = "table-builder"
status = "open"
verdict = "The geometry-row builder is checked against independent visible-cap integration and supplies ten arrival-direction moments. Interpolated tables and integration into the fast event routes remain unfinished; the default routes are unchanged."
cases = ["first-entry-receiver/geometry-rows"]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'first-entry-receiver/geometry-rows'"
inputs = ["unit-radius sphere, source distance 6 radii, pencil angles 0 / 0.7 / 2.8 rad, HG g=0.9, extinction times radius 0.12; synthetic geometry checks"]
notes = [
  "The pencil stops at its first glass intersection. Unrestricted inward surface flux includes paths that entered earlier and returned, so it cannot silently replace first-entry response.",
  "The row carries no wavelength-dependent attenuation, scattering coefficient, yield or detector efficiency. Path density scales as R^-2 and cumulative moments as R^-1.",
  "The path grid splits at the glass front, direct entry and tangent path. The direct entry is an internal logarithmic singularity for a pencil that hits the receiver.",
  "The registry case checks three scalar folded rows; tests/test_receiver_first.py checks all ten moments, physical-radius scaling and additional geometry. These checks establish no event-route timing or interpolation accuracy.",
]

[code]
modules = ["lighthit.receiver_first", "lighthit._receiver_first_numba"]
