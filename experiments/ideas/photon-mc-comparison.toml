id = "photon-mc-comparison"
title = "Default routes against NTSim's photon Monte Carlo on the same Geant4 event"
area = "routes"
question = """
Do the default routes agree with full photon Monte Carlo (30 scatterings, every photon) per OM and in time?
"""
kind = "reference"
status = "tool"
verdict = "Against one NTSim photon Monte Carlo run per event (every photon, 30 scatterings, photon yield per true Geant4 step length, Cherenkov band 350-600 nm; water grid of 2026-10-19, 32 wavelength nodes), EventTransport gives total charge ratios 0.987 (100 GeV electron, MC 6.33 +- 0.25 pe), 0.982 (pion, 3.95 +- 0.22 pe), 0.944 (nu_e CC, 5.29 +- 0.23 pe) and 1.049 (100 GeV muon in MuonTransport, 1.55 +- 0.14 pe), with per-OM pull RMS 1.38, 0.85, 1.08 and 1.73."
cases = [
  "photon-mc-comparison/electron-100GeV-run0",
  "photon-mc-comparison/muon-100GeV-run0",
  "photon-mc-comparison/nue-cc-run0",
  "photon-mc-comparison/pion-100GeV-run0",
]
how-to-run = """
python experiments/photon_mc.py NAME --run N (NTSim environment), then PYTHONPATH=src python experiments/run.py run 'photon-mc-comparison/*'
"""
inputs = [
  """
NTSim: CherenkovGenerator (photon_suppression=1) -> MCPhotonPropagator (HG, n_scatterings=30) -> SmartRayTracer, clusters 1-5
""",
  "the charged steps of the same event, saved by the Monte-Carlo process",
]
notes = [
  "The Monte-Carlo error of an OM is the square root of the summed squared hit weights.",
  """
The results below were measured with nine wavelength nodes (LightHit <= 0.3.0a4 tables); the deficit came from that quadrature. With 32 nodes the same comparison, split by scattering order and distance, is wavelength-quadrature/mc-*.
""",
  """
docs/accuracy.md quotes an earlier comparison (notebook): LightHit 5.89 pe, MC 5.82 / 5.86 / 5.48 +- 0.23.
""",
]

