id = "shower-frequency-nodes"
title = "RTE frequency nodes of order >=2 (65 vs 33) before the 321-node readout"
area = "shower"
question = "How much does order >=2 change when only every second table frequency is used?"
kind = "alternative-option"
status = "default"
verdict = "Using 33 instead of 65 RTE frequencies leaves order >=2 charge unchanged but raises its bin L1 from 0.309% to 1.33% (electron) and from 0.044% to 1.27% (pion), total L1 0.58% and 3.55%, at 0.95x and 0.84x wall."
baseline = "default-shower-route"
cases = [
  "shower-frequency-nodes/electron-100GeV-33",
  "shower-frequency-nodes/pion-100GeV-33",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'shower-frequency-nodes/*'"
inputs = [
  "bundle Geant4 100 GeV electron (event 5)",
  "regenerated pion-100GeV",
  """
reference-shower/<input> (original-step orders 0+1, per-band order >=2, on the OMs of the default route)
""",
]
notes = []

[code]
modules = ["lighthit.shower.api", "lighthit.readout"]
functions = []
options = ["ShowerConfig.frequency_nodes=65 (default)"]
scripts = ["scripts/shower_basis/exp3.py"]
tests = []

