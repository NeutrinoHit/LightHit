id = "banded-flash-cache"
title = """
Banded multipole cache for a point flash to 400 m (laser) on an idealised three-cluster array
"""
area = "core"
question = """
Cached laser response with three radial bands, trust radius from negative components, cost against direct solves.
"""
kind = "alternative-option"
status = "superseded-by:default-laser-route"
verdict = "The three-band cache interpolates to <= 1.2e-5 below 58 m but has 2.318 maximum relative error (median 1.4e-4) in the 62-390 m band and a first negative component at 299.6 m; a cached query takes 2.6 us vs 0.042 s per direct solve."
cases = ["banded-flash-cache/baikal-clusters", "banded-flash-cache/build"]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'banded-flash-cache/*'"
inputs = ["synthetic media and detectors built by the script (no bundle input)"]
notes = [
  """
The medium is lighthit.synthetic_medium() at 450 nm while the flash is 532 nm; the scripts call the result illustrative.
""",
]

[code]
modules = ["lighthit.cache"]
functions = ["BandedResponseCache", "validation_report", "first_order_consistency"]
options = []
scripts = ["scripts/build_cache.py", "scripts/run_baikal_clusters.py"]
tests = []

