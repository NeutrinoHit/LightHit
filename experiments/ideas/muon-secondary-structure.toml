id = "muon-secondary-structure"
title = "Structure of the muon's secondary light (families, delays, radial and angular moments)"
area = "muon"
question = """
How is the light of a muon's descendants distributed (delay, distance from the track, angle, family)? Basis for packetising the secondaries.
"""
kind = "probe"
status = "used-by-default"
verdict = "Secondaries emit 52.0%, 50.8% and 79.9% of the light of the 300 GeV, 1 TeV and 3 TeV muons; for the 1 TeV muon 94% of the light comes from tracks shorter than 1 m and the largest listed delay quantile is 0.57 ns."
cases = [
  "muon-secondary-structure/capture-electron-1000GeV",
  "muon-secondary-structure/capture-electron-100GeV",
  "muon-secondary-structure/summary",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'muon-secondary-structure/*'"
inputs = [
  "bundle 1 TeV muon (= the old muon1000.npz, sha256 e472ed6b...) and ancestry",
  """
regenerated 300 and 3000 GeV muons (same generator and seed as benchmark_long_muon.py generate; analyze_muon_secondaries.py --capture-source confirmed identical steps)
""",
  "bundle 100 GeV electron (HDF5 events 0, 1)",
  "regenerated 1 TeV electron (one event)",
]
notes = [
  """
--capture-source regenerates the Geant4 event and saves the particle ancestry the muon route needs (now built by NTSim's muon_ancestry).
""",
  "No transport; statistics of the steps.",
]

[code]
modules = ["lighthit.sources"]
functions = ["capture_ancestry (script)"]
options = []
scripts = ["scripts/shower_basis/analyze_muon_secondaries.py"]
tests = []

