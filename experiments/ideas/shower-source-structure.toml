id = "shower-source-structure"
title = """
Is a Geant4 shower effectively one-dimensional along its axis? (axis, separability, joint rank)
"""
area = "core"
question = """
Principal-axis spread, residual times and separability of (z, angle, time) that justify an axial basis.
"""
kind = "probe"
status = "used-by-default"
verdict = "Geant4 100 GeV electron light is axial: transverse rms 0.06-0.07 m vs 1.18-1.42 m along the axis, rho99 37.7 and 41.5 cm, tau99 0.26-0.29 ns (events 8, 9); held-out joint L1 for event 5 is 30.6%, 5.4% and 2.3% at ranks 0, 1 and 16."
cases = ["shower-source-structure/axis", "shower-source-structure/joint-rank"]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'shower-source-structure/*'"
inputs = [
  """
bundle Geant4 100 GeV electron (HDF5, event 5); the script builds its own small table for lighthit.synthetic_medium()
""",
  "events 0-9",
]
notes = []

[code]
modules = ["lighthit.axial_source", "lighthit.g4_source"]
functions = []
options = []
scripts = ["scripts/probe_shower_axis.py", "scripts/probe_shower_joint_rank.py"]
tests = []

