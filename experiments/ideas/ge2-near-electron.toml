id = "ge2-near-electron"
title = "Addressed multiple-scattering check at 20-50 m of the 100 GeV electron"
area = "shower"
question = "Does the 1.098 ratio to sixteen photon-MC runs come from the fast shower approximations or from the reference sample?"
kind = "validation"
status = "open"
verdict = "The 10% excess is not reproduced against an independent continuous-spectrum next-event estimate: 0.649 +/- 0.005 pe versus 0.639 pe from the fast route. The saved MC gives 0.582 pe. No production correction or slower route is enabled."
cases = ["ge2-near-electron/charge-controls", "ge2-near-electron/continuous-next-event"]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'ge2-near-electron/*'"
inputs = ["original electron-100GeV-run0 steps matching the SHA256 in photon-mc-matrix/electron-100GeV; supplied BGVD model; fifteen OMs whose nearest emitting steps lie at 20-50 m"]
notes = [
  "Halving source cells changes the group by about 0.0004%; all 32 bands without folding agree within 4e-8 relative. The four receivers retaining preview charge contribute less than 0.3% of group charge. No source point is near the 3 m table boundary, and this event has no delayed-light groups.",
  "One-band zero-frequency kernels rebuilt at the same settings match the prepared kernels. Doubling k_max has negligible effect. Source degree 128 and scattering degree 96 change the brightest OM by about -1.4 to -1.6% in the three node bands; this small truncation effect is separate from the claimed 10% group discrepancy.",
  "The independent reference samples the original steps and the continuous detected spectrum, uses implicit capture and unbiased geometric importance sampling, and scores first entry on supplied OM spheres. It has no finite scattering-order cutoff. Its HG-cap normalization and all-order collision weights have independent analytic tests.",
  "An addressed five-million-history reference gives >=2 about 0.649 +/- 0.005 pe and order 1 about 1.398 +/- 0.008 pe; the latter agrees with the saved MC 1.3940 pe. The registered reference records its actual sampling uncertainty.",
  "The saved 16-run >=2 error is 0.0155 pe from run spread, or 0.0189 pe from summed squared photon weights (about 948 effective weighted hits). Independent evidence favours a low fluctuation of that sample, rather than a 10% bias of the fast route; it does not prove that every numerical or photon-MC error is zero.",
  "31353 weighted reference rays through the actual NTSim tracer give no missed intersections, no wrong scattering orders, unabsorbed response differences below 3e-12 and a 0.0067% loss from earlier hits on other OMs. With physical absorption and a nonzero emission-time offset response differences stay below 9e-10; entry-time differences stay below 2e-6 ns. Optical coefficients agree to floating-point precision.",
  "Same fifteen receivers, vertex and direction: current zero-frequency >=2 / saved MC is 1.098 +/- 0.036 at 100 GeV (16 runs, suppression 1), 1.013 +/- 0.015 at 1 TeV (8 runs, suppression 1), and 0.997 +/- 0.020 at 10 TeV (4 runs, suppression 10). Errors here use summed squared photon weights. Effective weighted hits are 948, 4847 and 2462. Higher energy with stronger thinning and fewer runs need not improve statistics. No new photon events or production-route changes were required.",
]

[code]
modules = ["lighthit.shower.ge2"]
functions = ["node_sources", "apply_folded", "estimate", "collision_batch"]
options = ["zero frequency on fifteen receivers; continuous-spectrum next-event reference; unchanged production route"]
scripts = ["experiments/harness/ge2_reference.py", "experiments/harness/cases_ge2_near.py"]
tests = ["tests/test_ge2_next_event_reference.py"]

