id = "point-green-backends"
title = "NumPy vs Numba backends of the single-band point Green solver (lighthit CLI)"
area = "core"
question = "Are the angular and single-scattering backends equivalent, and how much faster is Numba?"
kind = "validation"
status = "tool"
verdict = "NumPy and Numba backends of the point Green solver agree to 4.2e-16 in charge and 6.0e-15 in bins; the warm Numba solve is 1.12x faster (2.39 s vs 2.67 s)."
cases = ["point-green-backends/numpy-vs-numba"]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'point-green-backends/*'"
inputs = ["examples/point-green.toml restored from git (ec553be~1)"]
notes = [
  "compare_runs.py compares two CLI output directories; it is a helper of this check.",
]

[code]
modules = [
  "lighthit.green",
  "lighthit.cli",
  "lighthit._angular_numba",
  "lighthit.single_fast",
]
functions = ["PointGreenSolver"]
options = [
  "PointGreenSolver(angular_backend='numpy'|'numba', single_backend=...)",
  "KernelConfig.angular_backend='auto'",
]
scripts = ["scripts/benchmark_backends.py", "scripts/compare_runs.py"]
tests = []

