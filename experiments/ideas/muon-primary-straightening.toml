id = "muon-primary-straightening"
title = "How coarsely can the primary muon be straightened (few chords, wiggle)?"
area = "muon"
question = "Order-0 timing and order-1 charge when the primary is replaced by 1..256 straight pieces."
kind = "probe"
status = "superseded-by:muon-primary-polyline"
verdict = "Replacing the 1 TeV primary by 1, 2, 4 or 16 chords gives order-1 relative charge errors 9.3%, 1.0%, 0.034% and 0.023% and bin L1 31.7%, 6.5%, 0.69% and 0.11% on the 0.086 pe control; the wiggle probe reaches charge L1 1.3e-4 at 256 pieces."
cases = [
  "muon-primary-straightening/few-chords-1TeV",
  "muon-primary-straightening/wiggle-1TeV",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'muon-primary-straightening/*'"
inputs = [
  "bundle 1 TeV muon (= the old muon1000.npz, sha256 e472ed6b...) and ancestry",
  """
regenerated 300 and 3000 GeV muons (same generator and seed as benchmark_long_muon.py generate; analyze_muon_secondaries.py --capture-source confirmed identical steps)
""",
]
notes = [
  "tests/test_muon_wiggle.py loads scripts/shower_basis/probe_muon_wiggle.py by path.",
]

