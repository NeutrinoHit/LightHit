id = "shower-order0-continuous-spectrum"
title = "Order 0 over the continuous spectrum (ballistic_interval) vs the nine-node quadrature"
area = "shower"
question = """
How much order-0 charge does the nine-wavelength quadrature miss compared with the continuous-spectrum interval method?
"""
kind = "alternative-option"
status = "default"
verdict = "The nine-node quadrature misses order-0 charge against the continuous-spectrum interval method: bias -8.87%, L1 34.8%, worst OM 121% (electron) and -9.47%, L1 51.9% (pion) at 1.02x and 1.01x wall; on the 1 TeV primary the interval method matches an independent evaluation to 5.2e-7."
baseline = "default-shower-route"
cases = [
  "shower-order0-continuous-spectrum/electron-100GeV-quadrature",
  "shower-order0-continuous-spectrum/muon-1TeV-primary",
  "shower-order0-continuous-spectrum/pion-100GeV-quadrature",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'shower-order0-continuous-spectrum/*'"
inputs = [
  "bundle Geant4 100 GeV electron (event 5)",
  "regenerated pion-100GeV",
  """
reference-shower/<input> (original-step orders 0+1, per-band order >=2, on the OMs of the default route)
""",
]
notes = []

[code]
modules = [
  "lighthit.ballistic_interval",
  "lighthit._ballistic_interval_numba",
  "lighthit.ballistic_fast",
]
functions = []
options = [
  "PromptConfig.ballistic_method='interval' (route) | 'quadrature' (PromptConfig default)",
]
scripts = ["scripts/shower_basis/benchmark_ballistic_interval.py"]
tests = [
  "tests/test_ballistic_interval.py",
  "tests/test_ballistic_interval_geometry.py",
]

