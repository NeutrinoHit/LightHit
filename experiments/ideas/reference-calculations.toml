id = "reference-calculations"
title = "Reference calculations of the comparisons: original-step orders 0+1, per-band order >=2"
area = "routes"
question = """
What every alternative is compared with: how are the references computed and what do they cost?
"""
kind = "reference"
status = "tool"
verdict = "The original-step references cost 191 s (electron), 23 s (pion), 246 s (nu_e CC, 1 thread), 115 s and 18 s (1 TeV and 300 GeV muons); per-band order >=2 costs 440 s (electron) and 971 s with 13.7 GB (300 GeV muon), is refused for the pion and does not fit 24 GB for the 1 TeV muon; the refined basis gives 1.01637 pe vs 1.01639 pe per-band on the electron."
cases = [
  "reference-original-steps/electron-100GeV",
  "reference-original-steps/pion-100GeV",
  "reference-per-band-ge2/electron-100GeV",
  "reference-per-band-ge2/pion-100GeV",
  "reference-shower/electron-100GeV",
  "reference-shower/pion-100GeV",
  "reference-finer-basis-ge2/electron-100GeV",
  "reference-finer-basis-ge2/pion-100GeV",
  "reference-original-steps/nue-cc",
  "reference-finer-basis-ge2/nue-cc",
  "reference-shower/nue-cc",
  "reference-original-steps/muon-1TeV",
  "reference-original-steps/muon-300GeV",
  "reference-per-band-ge2/muon-1TeV",
  "reference-per-band-ge2/muon-300GeV",
  "reference-muon/muon-1TeV",
  "reference-muon/muon-300GeV",
]
how-to-run = """
PYTHONPATH=src python experiments/run.py run 'reference-*/*' (after the default-route cases)
"""
inputs = [
  "the OM set and per-OM clock of the default route's saved response for the same input",
]
notes = [
  """
Computed on the OMs active in the default route plus those with at least half the threshold, with threshold 0 and the default route's per-OM clock; metrics against a reference therefore cover only those OMs.
""",
  """
Order 0 of the reference is the same continuous-spectrum ballistic_interval as the routes (exact on the original steps).
""",
  """
transport_hybrid refuses the pion and the nu_e CC showers ('prompt and RTE time origins differ'); their order >=2 reference is the shower basis refined to cell 0.125 m, time step 0.01 ns and band-fold rank 9 (reference-finer-basis-ge2), which is also run for the electron to compare the two order >=2 references.
""",
  """
The per-band order >=2 reference of the 1 TeV muon was killed for memory on the 24 GB machine (all 41 OMs at once and in chunks of 8 OMs); reference-muon/muon-1TeV holds orders 0 and 1 only and order >=2 of the muon variants is compared on the 300 GeV muon.
""",
  """
For muons the order-1 reference groups pencils (per band, no screen); 'segment' on all steps of a 1 TeV muon was not attempted.
""",
]
not_reproducible_parts = [
  "Per-band order >=2 reference of the 1 TeV muon: not computed, it does not fit the 24 GB measuring machine (killed for memory on all 41 OMs at once and in chunks of 8 OMs).",
]

[code]
modules = ["lighthit.prompt", "lighthit.transport"]
functions = ["TransportKernel.transport_prompt", "TransportKernel.transport_hybrid"]
options = [
  """
showers: PromptConfig(element_method='segment', ballistic_method='interval', screen=False, fuse_bands=False)
""",
  """
muons: PromptConfig(element_method='grouped', ballistic_method='interval', screen=False, fuse_bands=False)
""",
  "order >=2: transport_hybrid(ge2_basis=None), 65 frequencies",
  "muons, order >=2: transport_hybrid_basis(ShowerBasis(), representation='cells')",
  "pion, nu_e CC, order >=2: ShowerTransport with cell 0.125 m, time step 0.01 ns, band-fold rank 9",
]
scripts = []
tests = []

