id = "shower-basis-transverse"
title = "Transverse five-point stencil vs collapsing each slice to its axis"
area = "shower"
question = "Does the second-moment stencil matter for order >=2?"
kind = "alternative-option"
status = "default"
verdict = "Collapsing each slice to its axis raises order >=2 L1 from 0.309% to 1.11% (electron) and from 0.044% to 18.2% (pion, charge bias -0.80%, worst OM 2.8%) while saving 13% and 34% of the wall time (0.87x, 0.66x)."
baseline = "default-shower-route"
cases = [
  "shower-basis-transverse/electron-100GeV-collapse",
  "shower-basis-transverse/pion-100GeV-collapse",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'shower-basis-transverse/*'"
inputs = [
  "bundle Geant4 100 GeV electron (event 5)",
  "regenerated pion-100GeV",
  """
reference-shower/<input> (original-step orders 0+1, per-band order >=2, on the OMs of the default route)
""",
]
notes = []

[code]
modules = ["lighthit.shower_basis", "lighthit._shower_basis"]
functions = []
options = [
  "ShowerBasis.transverse='stencil' (default) | 'collapse'",
  "stencil_m=0.2, stencil_threshold_m=0.03",
]
scripts = ["scripts/shower_basis/exp4.py", "scripts/shower_basis/exp5.py"]
tests = []

