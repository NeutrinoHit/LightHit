id = "shower-basis-axial-order"
title = "Cubic vs linear axial interpolation of the order >=2 slices"
area = "shower"
question = "Is the cubic axial weight (axial_order=3) needed at 0.25 m slices?"
kind = "alternative-option"
status = "default"
verdict = "Linear instead of cubic axial weights raise order >=2 L1 from 0.309% to 0.356% (electron) and from 0.044% to 0.636% (pion) at the same charge (bias -0.0009% vs -0.0035% electron, 0.007% pion) and save no time (1.00x and 0.93x wall)."
baseline = "default-shower-route"
cases = [
  "shower-basis-axial-order/electron-100GeV-linear",
  "shower-basis-axial-order/pion-100GeV-linear",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'shower-basis-axial-order/*'"
inputs = [
  "bundle Geant4 100 GeV electron (event 5)",
  "regenerated pion-100GeV",
  """
reference-shower/<input> (original-step orders 0+1, per-band order >=2, on the OMs of the default route)
""",
]
notes = []

[code]
modules = ["lighthit.shower_basis", "lighthit._shower_basis"]
functions = []
options = ["ShowerBasis.axial_order=3 (default) | 1"]
scripts = ["scripts/shower_basis/exp6.py"]
tests = []

