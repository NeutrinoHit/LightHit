id = "shower-basis-time-deposit"
title = "Emission-phase deposition on the 0.02 ns lattice: linear vs nearest vs cubic"
area = "shower"
question = "Sensitivity of order >=2 to the time deposition rule."
kind = "alternative-option"
status = "default"
verdict = "Nearest or cubic emission-phase deposition gives order >=2 L1 0.3090% and 0.3091% (electron) and 0.0477% and 0.0435% (pion) against 0.3088% and 0.0439% for linear, with identical charge bias and the same wall time (1.00-1.02x)."
baseline = "default-shower-route"
cases = [
  "shower-basis-time-deposit/electron-100GeV-cubic",
  "shower-basis-time-deposit/electron-100GeV-nearest",
  "shower-basis-time-deposit/pion-100GeV-cubic",
  "shower-basis-time-deposit/pion-100GeV-nearest",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'shower-basis-time-deposit/*'"
inputs = [
  "bundle Geant4 100 GeV electron (event 5)",
  "regenerated pion-100GeV",
  """
reference-shower/<input> (original-step orders 0+1, per-band order >=2, on the OMs of the default route)
""",
]
notes = []

[code]
modules = ["lighthit.shower_basis", "lighthit._shower_basis"]
functions = []
options = ["ShowerBasis.time_deposit='linear' (default) | 'nearest' | 'cubic'"]
scripts = []
tests = []

