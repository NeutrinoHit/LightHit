id = "positive-fluence-preview"
title = "OM preview from a Monte-Carlo positive fluence atlas (table preview-atlas.npz)"
area = "muon"
question = """
Is the cheap positive-fluence estimate of orders 1 and >=2 good enough to select the OMs computed in detail?
"""
kind = "table-builder"
status = "used-by-default"
verdict = "On the 1 TeV muon the positive-fluence screen at margin 1 kept all 31 reference-active OMs among 42 candidates in 8.3 s; the fine route with this preview equals the NTSim hybrid centroid run (charge difference 0, bins L1 3.2e-8), and the seed-81 atlas rebuild is array-identical."
cases = [
  "positive-fluence-preview/atlas-rebuild",
  "positive-fluence-preview/fine-1TeV",
  "positive-fluence-preview/screen-1TeV",
  "positive-fluence-preview/segment-check",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'positive-fluence-preview/*'"
inputs = [
  "bundle 1 TeV muon (= the old muon1000.npz, sha256 e472ed6b...) and ancestry",
  """
regenerated 300 and 3000 GeV muons (same generator and seed as benchmark_long_muon.py generate; analyze_muon_secondaries.py --capture-source confirmed identical steps)
""",
]
notes = ["Since 2026-10-23 the preview also stores ten arrival-direction moments for the cubic OM acceptance. Scalar selection arrays and the random stream are unchanged; unselected charges use the actual orientation. The earlier measured results below precede this extension; see docs/accuracy.md for the addressed 100 GeV check and its cost."]

[code]
modules = ["lighthit.muon.positive_fluence", "lighthit.muon.preview", "lighthit.muon.angular_preview"]
functions = ["PositiveFluenceAtlas", "independent_preview", "query_angular_groups"]
options = []
scripts = [
  "tools/tables/build_positive_fluence.py",
  "scripts/shower_basis/check_positive_segment.py",
  "scripts/shower_basis/probe_positive_map_screen.py",
  "scripts/shower_basis/run_positive_map_fine.py",
]
tests = ["tests/test_positive_fluence.py", "tests/test_angular_preview.py"]

