id = "shower-basis-cell"
title = "Axial slice spacing of the order >=2 basis"
area = "shower"
question = "Convergence of order >=2 in the slice spacing (0.125 / 0.25 / 0.5 m)."
kind = "alternative-option"
status = "default"
verdict = "Against reference-shower, 0.125 m slices give order >=2 L1 0.339% (electron) and 0.0014% (pion; that reference is itself the 0.125 m basis), 0.5 m slices 0.584% and 0.605%, against 0.309% and 0.044% at the default 0.25 m; wall 1.13x/1.27x (0.125 m) and 0.94x/0.84x (0.5 m)."
baseline = "default-shower-route"
cases = [
  "shower-basis-cell/electron-100GeV-0.125m",
  "shower-basis-cell/electron-100GeV-0.5m",
  "shower-basis-cell/pion-100GeV-0.125m",
  "shower-basis-cell/pion-100GeV-0.5m",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'shower-basis-cell/*'"
inputs = [
  "bundle Geant4 100 GeV electron (event 5)",
  "regenerated pion-100GeV",
  """
reference-shower/<input> (original-step orders 0+1, per-band order >=2, on the OMs of the default route)
""",
]
notes = []

[code]
modules = ["lighthit.shower_basis", "lighthit._shower_basis"]
functions = []
options = ["ShowerBasis.cell_m=0.25 (default)"]
scripts = ["scripts/shower_basis/exp1.py", "scripts/shower_basis/exp5.py"]
tests = []

