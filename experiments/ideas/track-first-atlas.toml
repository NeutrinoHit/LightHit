id = "track-first-atlas"
title = "Finite-track order-1 atlas of the primary (beta = 1), table q1-atlas"
area = "muon"
question = """
Can order 1 of straight beta=1 pieces be read from an event-independent atlas of radius rows?
"""
kind = "table-builder"
status = "used-by-default"
verdict = "For one 1 TeV beta=1 primitive row the order-1 atlas reproduces the direct charge to 0.12-0.68% and bins to 0.81-2.1% at three time shifts, and to 7.4% (charge and bins) at the 0.74 ns shift where the charge is 1.2e-11 pe."
cases = ["track-first-atlas/primitive-1TeV"]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'track-first-atlas/*'"
inputs = [
  "bundle 1 TeV muon (= the old muon1000.npz, sha256 e472ed6b...) and ancestry",
  """
regenerated 300 and 3000 GeV muons (same generator and seed as benchmark_long_muon.py generate; analyze_muon_secondaries.py --capture-source confirmed identical steps)
""",
]
notes = [
  """
Builder: tools/tables/build_track_first_atlas.py (moved from scripts/shower_basis/build_universal_track_first.py); build order and arguments in tools/tables/README.md.
""",
]

