id = "default-event-route"
title = "Several sources on one clock: lighthit.event.EventTransport"
area = "routes"
question = """
Does the event composition (one clock, summed-charge selection, completion rounds, muon->shower fallback) run on real events, and at what cost?
"""
kind = "route"
status = "default"
verdict = "At 1 thread, with every muon in MuonTransport: 100 GeV muon 33.2 s, stopping muon 14.2 s, the muon passing OM 267 at 1.76 m 14.5 s (near-field clamp), nu_e CC 12.6 s, nu_mu CC 103.6 s, nu_mu-like 93.7 s; no accuracy reference exists."
cases = [
  "default-event-route/muon-100GeV",
  "default-event-route/muon-near-om",
  "default-event-route/muon-stopping",
  "default-event-route/nue-cc",
  "default-event-route/numu-cc",
  "default-event-route/numu-like",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'default-event-route/*'"
inputs = [
  "bundle: 1 TeV muon + 100 GeV electron (numu-like, as in the stand-alone notebook)",
  """
regenerated: numu-cc (mu 800 + pi+ 150 + p 50 GeV), nue-cc, muon-stopping, muon-near-om, muon-100GeV
""",
]
notes = [
  """
muon-stopping: a 6 GeV muon aimed 1.5 m past OM 267 that stops 15 m before it. The muon route raises 'unvalidated inner' (the line of a primary piece passes the OM) and the shower route computes it: route_fallbacks has one entry (usage scenario event-stopping-muon).
""",
  """
muon-near-om: the same muon started 20 m before OM 267 passes it at 1.76 m. The fallback is entered, then the shower route raises 'source points closer than the validated radial minimum 3 m'; the event has no result.
""",
  "Executed functions: docs/usage-map.md.",
]

[code]
modules = ["lighthit.event"]
functions = [
  "EventTransport.__call__",
  "EventTransport._compose",
  "EventTransport._run",
  "common_time_origins",
]
options = ["safety=3.0", "max_rounds=4"]
scripts = []
tests = ["tests/test_event.py"]

