id = "muon-primary-beta-batch"
title = "Batched axial-basis order >=2 of slow primary pieces"
area = "muon"
question = "Effect of batch_beta_charge=True (default) on slow (beta<1) primary pieces."
kind = "alternative-option"
status = "default"
verdict = "With batch_beta_charge off the 1 TeV response is bitwise identical (no slow primary piece contributes) and the 300 GeV order >=2 charge changes by 8.5e-7 relative (max 1.3e-7 pe per OM), at 1.00x and 0.98x the default wall time."
baseline = "default-muon-route"
cases = [
  "muon-primary-beta-batch/muon-1TeV-off",
  "muon-primary-beta-batch/muon-300GeV-off",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'muon-primary-beta-batch/*'"
inputs = [
  "bundle 1 TeV muon + ancestry",
  "regenerated 300 GeV muon (bit-identical regeneration checked on the 1 TeV event)",
  """
reference-muon/<input> (orders 0+1 of all original steps by the grouped per-band prompt without screen, order >=2 per band cloud-in-cell, on the OMs of the default route)
""",
]
notes = []

[code]
modules = ["lighthit.muon.universal_primary", "lighthit.muon.ge2_beta_response"]
functions = []
options = [
  "transport_universal_primary(batch_beta_charge=True, beta_cell_m=0.25)",
]
scripts = []
tests = ["tests/test_ge2_beta_response.py"]

