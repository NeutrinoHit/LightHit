id = "ntsim-compare-expected-pe"
title = """
NTSim comparison of expected photoelectrons by scattering order (compare_expected_pe.py): photon Monte Carlo orders 0 and 0+1 against LightHit's prompt orders
"""
area = "validation"
question = """
Do LightHit's direct and once-scattered light agree with the photon Monte Carlo of the same event, order by order?
"""
verdict = "Against the photon Monte Carlo of the same event (hits by scattering order, water grid of 2026-10-19), the default prompt route gives order 0 0.977 +- 0.059 and orders 0+1 0.995 +- 0.045 of the Monte Carlo on the 100 GeV electron (203 s) and 1.019 +- 0.127 and 0.994 +- 0.098 on the 100 GeV muon (1503 s, all steps through the prompt solver)."
kind = "validation"
status = "superseded-by:photon-mc-comparison"
cases = ["ntsim-compare-expected-pe/electron-100GeV-run0", "ntsim-compare-expected-pe/muon-100GeV-run0"]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'ntsim-compare-expected-pe/*'"
inputs = [
  "experiments/inputs/mc/<event>-run0-steps.npz and -hits.npz (photon_mc.py --orders: NTSim photon MC, 30 scatterings, every photon, the scattering order of every hit)",
]
notes = [
  """
The script replayed the stored Geant4 tracks of an NTSim run through CherenkovTracksGenerator -> MCPhotonPropagator with one and two photon-flight segments (orders 0 and 0+1, photon suppression 10) and printed them next to the charge of a LightHit prompt run. Here the order of every Monte-Carlo hit is recorded by photon_mc.py, so one run gives both sums at full statistics.
""",
  """
Its --aligned-lighthit option rescaled the LightHit yields from the Geant4 step length to the chord, because NTSim's generator then emitted along the chord; NTSim now uses the true step length (full-rte d5993d8), so that option no longer applies (the chord-yield variant is measured in finite-receiver-order0/muon-near-om-mc).
""",
  "Superseded by photon-mc-comparison and wavelength-quadrature/mc-* (per order and distance, all orders).",
]

[code]
modules = ["lighthit.prompt"]
functions = ["TransportKernel.transport_prompt"]
options = ["PromptConfig() (default)"]
scripts = ["experiments/photon_mc.py"]
tests = []

