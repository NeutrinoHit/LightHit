id = "secondary-spectral-validation"
title = """
Secondary order >=2: original-chord point reference vs axial bases (standard and travelling carrier)
"""
area = "muon"
question = """
How large is the source-representation error of the axial bases for all secondary steps, and how much late light is emitted after the window?
"""
kind = "validation"
status = "open"
verdict = "Against original-chord point references the standard 0.5 m axial basis has max waveform difference 1.0% (1 TeV) and up to 1.1% over three energies, the travelling carrier 0.25-1.2%; light provably after the window is <= 1.0e-5 of order >=2, and the direct >=2 basis check gives charge 1.9e-6 and bins L1 0.44%."
cases = [
  "secondary-spectral-validation/1TeV",
  "secondary-spectral-validation/causal-window-1TeV",
  "secondary-spectral-validation/direct-ge2-1TeV",
  "secondary-spectral-validation/three-energies",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'secondary-spectral-validation/*'"
inputs = [
  "bundle 1 TeV muon (= the old muon1000.npz, sha256 e472ed6b...) and ancestry",
  """
regenerated 300 and 3000 GeV muons (same generator and seed as benchmark_long_muon.py generate; analyze_muon_secondaries.py --capture-source confirmed identical steps)
""",
]
notes = []

[code]
modules = ["lighthit._shower_basis", "lighthit.muon.point_ge2"]
functions = []
options = []
scripts = [
  "scripts/shower_basis/validate_secondary_spectral.py",
  "scripts/shower_basis/run_secondary_spectral_check.sh",
  "scripts/shower_basis/probe_secondary_direct_ge2.py",
  "scripts/shower_basis/check_secondary_causal_window.py",
]
tests = []

