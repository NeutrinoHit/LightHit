id = "experimental-aliases"
title = """
lighthit.experimental.<name> aliases of modules that moved to lighthit.* and lighthit.muon.*
"""
area = "core"
question = "Which old import names still resolve, and who uses them?"
kind = "tool"
status = "tool"
verdict = "Not measured: the idea has no case; it is an inventory of import aliases and records only code facts in its notes."
cases = []
how-to-run = """
python -c "import lighthit.experimental.joint_muon" (each alias is the same module object as its target)
"""
inputs = []
notes = [
  """
No module of src/lighthit imports through an alias; tests and scripts do, and tests monkeypatch through alias names (tests/test_joint_muon.py, tests/test_universal_primary.py).
""",
  """
Shipped in the wheel: axial_fast, axial_source, ballistic_fast, event_moments, g4_source, hdf5_minimal (packaging_filter.REQUIRED_EXPERIMENTAL); lighthit.experimental.hdf5_minimal has no user.
""",
]

