id = "event-moments-route"
title = "Joint block-multipole (moment) route for showers (lighthit.event_moments)"
area = "core"
question = """
Is a shower well represented by block multipole moments, and where does the expansion break down (L_q h / r > 1)?
"""
kind = "alternative-option"
status = "superseded-by:default-shower-route"
verdict = "Block moments reproduce the zero-frequency charge (median error 5.2e-5 with 4 blocks; apply 0.34 s vs 26.0 s direct for 65 receivers) but not the time structure: median error 1.0 at 0.6 rad/ns with 4 blocks, 3.7e-3 with 256 blocks, and 1.22 at 0.3 rad/ns with 1 block."
cases = [
  "event-moments-route/benchmark",
  "event-moments-route/block-channels",
  "event-moments-route/frequency",
  "event-moments-route/moments",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'event-moments-route/*'"
inputs = [
  """
bundle Geant4 100 GeV electron (HDF5, event 5); the script builds its own small table for lighthit.synthetic_medium()
""",
]
notes = [
  """
Only real_spherical_harmonics of lighthit.event_moments is used by a default path (axial_source).
""",
]

[code]
modules = ["lighthit.event_moments"]
functions = [
  "BlockPartition",
  "compile_joint_moments",
  "KernelChannels",
  "direct_response",
]
options = ["BlockPartition.split(strategy='extent'|'photons')"]
scripts = [
  "scripts/run_shower_moments.py",
  "scripts/run_shower_frequency.py",
  "scripts/probe_block_channels.py",
  "scripts/benchmark_moment_route.py",
]
tests = ["tests/test_event_moments.py"]

