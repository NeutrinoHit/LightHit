id = "wavelength-quadrature"
title = "32 Gauss-Legendre wavelength nodes for the scattered orders instead of nine (KernelConfig.wavelength_nodes)"
area = "core"
question = """
Why does LightHit give less light than NTSim's photon Monte Carlo (registry photon-mc-comparison: 0.948 +- 0.025 over four events, growing with distance), and how many wavelength nodes do orders 1 and >=2 need?
"""
kind = "alternative-option"
status = "default"
verdict = "Nine Gauss-Legendre wavelength nodes miss the Baikal transparency window (0.042 /m at 495.6 nm): the attenuated spectrum is +4.1% at 0 m, -6.1% at 50 m and -28.8% at 120 m, order 1 is 0.935-0.945 of 64 nodes, and against the photon Monte Carlo orders 1 and >=2 fall to 0.83-0.88 at 80-100 m and 0.4-0.6 beyond 170 m (point source); 32 nodes keep the spectrum within 0.8% to 200 m and order 1 within 0.5%, the three showers give 0.971, 1.000 and 0.976 of the Monte Carlo (together 0.980 +- 0.026, nine nodes 0.951) and the point source 0.95-1.00 to 130 m, at 1.3-1.7 times the shower time and 2.3 times the muon time."
baseline = "default-shower-route"
cases = [
  "wavelength-quadrature/spectral-integral",
  "wavelength-quadrature/order1-electron-100GeV",
  "wavelength-quadrature/order1-pion-100GeV",
  "wavelength-quadrature/order1-nue-cc",
  "wavelength-quadrature/mc-electron-100GeV-nodes9",
  "wavelength-quadrature/mc-pion-100GeV-nodes9",
  "wavelength-quadrature/mc-nue-cc-nodes9",
  "wavelength-quadrature/mc-muon-100GeV-nodes9",
  "wavelength-quadrature/point-mc-nodes9",
  "wavelength-quadrature/mc-electron-100GeV-nodes32",
  "wavelength-quadrature/mc-pion-100GeV-nodes32",
  "wavelength-quadrature/mc-nue-cc-nodes32",
  "wavelength-quadrature/mc-muon-100GeV-nodes32",
  "wavelength-quadrature/point-mc-nodes32",
]
how-to-run = """
python experiments/photon_mc_point.py --seed S (NTSim environment, S = 1..4); LIGHTHIT_DATA=<bundle built for 9 nodes> PYTHONPATH=src python experiments/run.py run 'wavelength-quadrature/*nodes9'; LIGHTHIT_DATA=<bundle built for 32 nodes> PYTHONPATH=src python experiments/run.py run 'wavelength-quadrature/*nodes32' 'wavelength-quadrature/spectral-integral' 'wavelength-quadrature/order1-*'
"""
inputs = [
  "the photon Monte-Carlo events of photon-mc-comparison (inputs/mc/<event>-run0, with the scattering order of every hit)",
  """
inputs/mc/point-seed<S>-steps.npz and -hits.npz: isotropic Cherenkov point source 8 m from the central string of cluster 1 (50000 random 5 cm steps of a 100 GeV muon per run, 6.2e7 photons, photon_mc_point.py)
""",
  "bundle model (water, OM response); RTE tables, >=2 pack and muon tables built for 9 nodes (data bundle of LightHit <= 0.3.0a4) and for 32 nodes",
]
notes = [
  """
Order 0 is integrated over the continuous spectrum (ballistic_interval) and is the same with either quadrature; the references of the registry (original-step orders 0 and 1, per-band order >=2) use the kernel's own nodes, so they could not see this error.
""",
  """
The muon's primary order 1 comes from the q1 atlas built over 82 nodes (primary_spectral_quadrature) and never had the error; its event moves only from 0.925 to 0.939. 15.5 % of the muon's light is emitted outside NTSim's world cylinder with the 100 m margin, where the Monte Carlo creates no photons; the case drops those steps on the LightHit side as well (no visible change).
""",
  """
Muon route far from the track (32 nodes): OMs 60-100 m from the track piece order 1 0.029 against 0.016 +- 0.005 pe, order >=2 0.038 against 0.015 +- 0.003 pe; beyond 100 m order >=2 0.008 against 0.002 pe. The point source agrees there, so it is a muon-route question (docs/known-issues.md).
""",
  """
Time with 32 nodes (one thread, same machine): 100 GeV e 6.6 -> 8.4 s, pi+ 22.9 -> 38.2 s, nu_e CC 14.9 -> 22.6 s, 100 GeV muon 36 -> 84 s (its primary's direct order >=2 batch runs over every node: 48.6 s); shower peak RSS 3.5-4.2 -> 6.6-6.8 GB (band fold built in memory from the 4.8 GB pack). The 32-node bundle: RTE tables 4.3 GB (16 s per node), >=2 pack 4.5 GB, muon tables 1.0 GB (ge2 atlas 44 rows in 695 s single-threaded).
""",
  """
Two Monte-Carlo runs of the 100 GeV electron (this registry's and the NTSim notebook's) give 6.26 +- 0.24 and 6.56 +- 0.25 pe; LightHit with 32 nodes 6.08 pe.
""",
]

[code]
modules = ["lighthit.transport", "lighthit.shower_basis", "lighthit.muon.preview"]
functions = ["KernelConfig", "Ge2KernelStore.bundle", "check_atlas_optics"]
options = [
  "KernelConfig.wavelength_nodes=32 (default) | 9 (LightHit <= 0.3.0a4)",
]
scripts = ["experiments/photon_mc_point.py"]
tests = ["tests/test_wavelength_quadrature.py"]

