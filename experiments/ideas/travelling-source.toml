id = "travelling-source"
title = "Coarse axial cells with a travelling (c-speed) phase carrier for secondaries"
area = "muon"
question = """
Can 1-2 m cells with an explicit travelling phase replace fine cells for the secondaries' order >=2?
"""
kind = "probe"
status = "open"
verdict = "For 1 TeV secondaries, 1 m cells give max bins L1 0.104 without and 0.015 with the travelling phase carrier, and 2 m cells 0.367 and 0.087; apply takes 12.4 s for 1 m and 6.4 s for 2 m cells."
cases = ["travelling-source/1TeV"]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'travelling-source/*'"
inputs = [
  "bundle 1 TeV muon (= the old muon1000.npz, sha256 e472ed6b...) and ancestry",
  """
regenerated 300 and 3000 GeV muons (same generator and seed as benchmark_long_muon.py generate; analyze_muon_secondaries.py --capture-source confirmed identical steps)
""",
]
notes = ["ShowerBasis does not expose the carrier; no route uses it."]

[code]
modules = []
functions = []
options = ["compile_axial_slices(axial_clock_ns_per_m=1/c)"]
scripts = ["scripts/shower_basis/probe_travelling_source.py"]
tests = []

