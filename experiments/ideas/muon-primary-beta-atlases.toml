id = "muon-primary-beta-atlases"
title = "beta < 1 corrections of the primary atlases (first-beta-charge, ge2-beta-charge)"
area = "muon"
question = "What do the two beta atlases change against the direct integrals they replace?"
kind = "alternative-option"
status = "default"
verdict = "Without both beta atlases the 1 TeV response is bitwise identical and the 300 GeV order-1 and order >=2 charges change by 3.1e-6 and 1.6e-5 relative (order-1 bias 3.2352% to 3.2355%), at 1.01x and 1.06x the default wall time."
baseline = "default-muon-route"
cases = [
  "muon-primary-beta-atlases/muon-1TeV-off",
  "muon-primary-beta-atlases/muon-300GeV-off",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'muon-primary-beta-atlases/*'"
inputs = [
  "bundle 1 TeV muon + ancestry",
  "regenerated 300 GeV muon (bit-identical regeneration checked on the 1 TeV event)",
  """
reference-muon/<input> (orders 0+1 of all original steps by the grouped per-band prompt without screen, order >=2 per band cloud-in-cell, on the OMs of the default route)
""",
]
notes = []

[code]
modules = [
  "lighthit.muon.first_charge_beta_atlas",
  "lighthit.muon.ge2_charge_beta_atlas",
]
functions = []
options = [
  "MuonTransport passes first_beta_atlas and ge2_beta_atlas; None = direct integrals",
]
scripts = []
tests = [
  "tests/test_first_charge_beta_atlas.py",
  "tests/test_ge2_charge_beta_atlas.py",
]

