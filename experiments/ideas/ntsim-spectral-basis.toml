id = "ntsim-spectral-basis"
title = """
NTSim check of the spectral hybrid (check_spectral_basis.sh): legacy per-band >=2 against the shower basis, the track channel and the fused 33-frequency track
"""
area = "routes"
question = """
What the four routes of NTSim's former spectral-hybrid check give on its own events (100 GeV electron and muon in cluster 1), and how far the shower basis, the track channel and the fast track are from the legacy per-band order >=2.
"""
verdict = "On the electron of check_lighthit.sh (cluster 1, 29 active OMs) the shower basis reproduces the legacy per-band order >=2 to charge bias -7e-6 and bin L1 0.43% in 72.9 s against 1147.8 s, with identical orders 0 and 1; the legacy route refuses the cluster-1 muon (253 OMs outside the validated directional radial range). On that muon the track channel and the fused 33-frequency fast track change order >=2 against the shower basis by -0.028% in charge and 1.3% and 2.1% in bins, at 1308.9 s and 695.0 s against 1756.2 s."
kind = "alternative-option"
status = "superseded-by:default-shower-route"
baseline = "ntsim-spectral-basis/electron-100GeV-reference"
cases = [
  "ntsim-spectral-basis/electron-100GeV-reference",
  "ntsim-spectral-basis/electron-100GeV-basis",
  "ntsim-spectral-basis/muon-100GeV-cluster1-basis",
  "ntsim-spectral-basis/muon-100GeV-cluster1-track",
  "ntsim-spectral-basis/muon-100GeV-cluster1-fast-track",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'ntsim-spectral-basis/*'"
inputs = [
  "regenerated electron-100GeV (NTSim ToyGen, seed 42: the event of check_lighthit.sh 11)",
  "regenerated muon-100GeV-cluster1 (the same vertex and direction with a 100 GeV muon: check_lighthit.sh 13)",
  "the bundle model restricted to the OMs of cluster 1 (the script ran --clusters 1)",
]
notes = [
  """
Reproduces ntsim run/check_spectral_basis.sh [11|13] [reference|basis|track|fast-track] -> run/check_lighthit.sh hybrid -> run_lighthit.py --mode hybrid --hybrid-ge2-basis default|shower [--hybrid-track-uid] [--hybrid-spectral-fusion --hybrid-frequency-nodes 33], which LightHitTransport._transport turns into kernel.transport_hybrid(source, frequency_nodes, ge2_basis) with the default prompt (screen on).
""",
  """
The route variants are compared within the idea, not with the registry references: the events differ from the bundle electron and the regenerated muons of reference-shower and reference-muon. The electron's basis is compared with its legacy per-band route ('reference'); the legacy route refuses the muon (ValueError: 253 OMs outside the validated directional radial range have a conservative estimate above threshold), so the script's 'reference' run failed for pdg 13 and the muon's track and fast-track are compared with its shower basis.
""",
  "The script also took the tables of the data bundle (rte-cache with 65 frequencies, ge2-pack); NUMBA_NUM_THREADS 4 (12 for fast-track) there, one thread here.",
]

[code]
modules = ["lighthit.transport", "lighthit.shower_basis", "lighthit._shower_basis"]
functions = ["TransportKernel.transport_hybrid"]
options = [
  "ge2_basis=None (legacy per band), ShowerBasis(), ShowerBasis(track_uid=<primary>), ShowerBasis(track_uid=<primary>, spectral_fusion=True)",
  "frequency_nodes=65, or 33 for fast-track",
]
scripts = []
tests = []

