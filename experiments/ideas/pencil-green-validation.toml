id = "pencil-green-validation"
title = "Directed photon laboratory: equal-volume RTE, independent Monte Carlo and analytic checks"
area = "core"
question = "Can the monochromatic pencil Green kernel be verified separately from event sources, finite-OM boundaries, Fourier inversion and statistical/numerical resolution?"
kind = "validation"
status = "tool"
verdict = "The full synthetic protocol resolves 27 nonzero charge comparisons at the declared 3% precision and gives nine exact ballistic zeros; finer RTE controls and independent photon histories agree. Coarse angular/spatial settings and finite time-frequency bandwidth are reported separately."
cases = ["pencil-green-validation/quick", "pencil-green-validation/full"]
how-to-run = "python -m lighthit.examples.pencil_validation --profile full --output results/pencil-full; PYTHONPATH=src python experiments/run.py run 'pencil-green-validation/*'"
inputs = ["explicit synthetic monochromatic medium; one unit photon at the origin along +z; finite spherical-sector probes at 10, 30 and 125 m; no private detector or Geant4 inputs"]
notes = [
  "MC uses complete-history track-length scores and counts recrossings. This is scalar fluence averaged over the same finite volume as RTE, not a glass first-entry probability.",
  "No finite path or collision-order cutoff is imposed. Absorption weighting, unbiased Russian roulette and an optional isotropic/HG proposal mixture have separate normalization controls.",
  "Analytic global collision orders, zero wave number, no scattering, independent chi quadrature for order 1, analog absorption, isotropic source/scattering, probe refinement and finite-sphere ballistic entry are checked.",
  "Scattering degree, spatial angular degree, wave-number cutoff/panels and volume quadrature are independently refined. The reference is fixed before comparing to MC; observed numerical spread is not a rigorous error bound.",
  "Full mode stores 1.6 million main histories. Per-batch and per-history errors, effective histories and structural-zero/statistics/resolution/discrepancy statuses are explicit; charges and time bins are never clipped or normalized to the MC.",
  "Time plots distinguish raw MC histograms, finite-frequency MC reconstructions and RTE; frequency spacing, cutoff and histogram resolution are reported independently.",
  "Stored arrays are reused only with matching inputs, dependency versions and source hashes. Registry timings can include reuse; numerical_work_seconds is a sum of stored generation timings, not fresh event throughput.",
  "This laboratory does not change the production routes or build surface-scattering atlases. The student guide is docs/pencil-validation.md.",
]

[code]
modules = ["lighthit.validation.cells", "lighthit.validation.beam_mc", "lighthit.validation.beam_rte", "lighthit.validation.pencil_experiment", "lighthit.validation.pencil_plots"]
functions = ["estimate_cells", "cell_spectra", "global_spectra", "ballistic_cells", "run_experiment"]
options = ["quick/full profiles; strict charge/analytic diagnostics; physical or importance-sampled HG; implicit or analog absorption; optional model water; code-hashed resume"]
scripts = ["src/lighthit/examples/pencil_validation.py", "experiments/harness/cases_pencil_validation.py"]
tests = ["tests/test_pencil_validation.py", "tests/test_green.py", "tests/test_angular.py"]

