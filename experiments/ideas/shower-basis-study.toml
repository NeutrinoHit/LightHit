id = "shower-basis-study"
title = """
Shower-basis study: order >=2 source representation on cluster 1 (cells, slices, stencil, degree, frequencies, angular compression)
"""
area = "shower"
question = """
Which order >=2 source representation reproduces the cloud-in-cell hybrid on a 100 GeV electron, at what cost? The study that led to ShowerBasis().
"""
kind = "probe"
status = "used-by-default"
verdict = "Against the 0.12 m cloud-in-cell hybrid (100 GeV electron, cluster 1) the 0.25 m axial basis reaches order >=2 L1 0.81%, total L1 0.18% (exp4); L=16 gives 32.5%, 33 frequencies 5.3%; on a new pose it took 46.6 s vs 336.0 s (charge error 1.4e-4)."
cases = [
  "shower-basis-study/angular-compression",
  "shower-basis-study/basis-e100",
  "shower-basis-study/benchmark",
  "shower-basis-study/exp1",
  "shower-basis-study/exp2",
  "shower-basis-study/exp3",
  "shower-basis-study/exp4",
  "shower-basis-study/exp5",
  "shower-basis-study/exp6",
  "shower-basis-study/frequency-interpolation",
  "shower-basis-study/pose",
  "shower-basis-study/reference-cic-0.12m",
  "shower-basis-study/reference-cic-0.5m",
]
how-to-run = """
PYTHONPATH=src python experiments/run.py run 'shower-basis-study/*' (the reference-cic cases first; files are read from experiments/results/work/shower-basis)
"""
inputs = [
  """
bundle model restricted to cluster 1 (288 OMs; the study used load_bgvd_model(clusters=1), whose water and OM response equal the bundle's)
""",
  "bundle 100 GeV electron (events 0-9), bundle rte-cache and ge2-pack",
  "321-frequency tables for study_frequency.py ($LIGHTHIT_RTE_CACHE_321, not in the bundle)",
]
notes = [
  """
exp*.py compare against ref_e100_5.npz, the cloud-in-cell transport_hybrid with KernelConfig.cell_m=0.12 written by run_hybrid.py (the cell size is inferred from labels in exp1/exp5).
""",
  """
build_cache.py built the 65-frequency cache of the study; the bundle's rte-cache replaces it (same physics keys).
""",
  """
The default shower route uses this basis (ShowerBasis defaults) on band-folded kernels; the shower-* ideas measure its settings on the route itself.
""",
]

[code]
modules = ["lighthit.shower_basis", "lighthit._shower_basis", "lighthit.axial_fast"]
functions = ["transport_hybrid_basis", "compile_axial_slices", "apply_multi_spectral"]
options = [
  "ShowerBasis(cell_m, axial_order, transverse, stencil_m, time_step_ns)",
  "KernelConfig.cell_m (cloud-in-cell reference)",
]
scripts = [
  "scripts/shower_basis/common.py",
  "scripts/shower_basis/proto.py",
  "scripts/shower_basis/exp1.py",
  "scripts/shower_basis/exp2.py",
  "scripts/shower_basis/exp3.py",
  "scripts/shower_basis/exp4.py",
  "scripts/shower_basis/exp5.py",
  "scripts/shower_basis/exp6.py",
  "scripts/shower_basis/run_hybrid.py",
  "scripts/shower_basis/run_basis.py",
  "scripts/shower_basis/run_pose.py",
  "scripts/shower_basis/compare.py",
  "scripts/shower_basis/study_angular.py",
  "scripts/shower_basis/summarize_angular.py",
  "scripts/shower_basis/study_frequency.py",
  "scripts/shower_basis/build_cache.py",
  "scripts/shower_basis_benchmark.py",
]
tests = ["tests/test_shower_route.py"]

