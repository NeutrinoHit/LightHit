id = "default-laser-route"
title = "Laser flash: lighthit.event.laser_kernel + TransportKernel flash path"
area = "routes"
question = "Cost and result of the isotropic calibration flash on the bundle laser table."
kind = "route"
status = "default"
verdict = "The 532 nm calibration flash on the bundle laser table takes 0.100 s at 1 thread with 1002 active OMs; no reference is attached to this case (independent flash references are separate ideas). The 0.3.0a6 glass kit ships the same laser table file; the @glass response is identical to the centre-referenced one. Against a photon MC of the same flash (1e8 photons) the total is 0.967 +- 0.018 (laser-532nm@glass in photon-mc-matrix). The first-entry laser table (tools/tables/build_glass_laser.py: source degree 0, scattering degree 96 and the kit's receiver numerics, 321 frequencies, 70 min with 3 workers, 9.3 MB) counts the flash at the glass like the shower and muon routes: laser-532nm@glass-laser takes 0.31 s at 1 thread (order 0 by quadrature on the sphere), 937 active OMs, charge +0.84 % (order 0 +1.06 %), 0.975 +- 0.018 of the MC."
cases = ["default-laser-route/laser-532nm"]
how-to-run = "PYTHONPATH=src python experiments/run.py run default-laser-route/laser-532nm; glass table: LIGHTHIT_LASER_TABLES=DIR ... --variant glass-laser (DIR from tools/tables/build_glass_laser.py)"
inputs = [
  "bundle: tables/laser-cache (532 nm, 5 ns bins), model/bgvd-model.npz",
  "flash: 1e15 photons, 532 nm, at (-62, -385, 361) m as in the stand-alone notebook",
  "glass-laser: $LIGHTHIT_LASER_TABLES, a directory with laser-data.json and the first-entry directional table",
]
notes = [
  """
Independent references of the flash path (crossing_mc, stationary_modes, segment_reference) are separate ideas.
""",
]

[code]
modules = ["lighthit.event", "lighthit.transport", "lighthit.single", "lighthit.cache", "lighthit._flash_receiver"]
functions = ["laser_config", "laser_kernel", "laser_settings", "TransportKernel._transport_isotropic", "transport_flash_first_entry"]
options = []
scripts = ["tools/tables/build_glass_laser.py"]
tests = ["tests/test_event.py", "tests/test_geometry_and_pose.py", "tests/test_flash_receiver.py"]

