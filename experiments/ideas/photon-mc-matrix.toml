id = "photon-mc-matrix"
title = "Default routes against the photon Monte Carlo over energies, particles, geometries and distances"
area = "routes"
question = """
Do the default routes agree with NTSim's photon Monte Carlo for electrons, pions and muons from 10 GeV to 10 TeV, neutrino events and several geometries, per scattering order and per OM distance, within max(2 sigma, 3 %) where a distance bin carries more than 0.1 % of the charge?
"""
kind = "validation"
status = "tool"
verdict = "On 14 Geant4 events (e 10 GeV-10 TeV, pi+ 10 GeV-1 TeV, mu 100 GeV-10 TeV, nu_e CC, nu_mu CC, two geometries; 4-32 MC runs each) the default routes give 0.965-1.035 of the photon-MC total charge; three events fail a distance bin: pion 100 GeV at 50-100 m (0.964 +- 0.015), the 1 TeV muon at 100-150 m (1.118 +- 0.021, 0.4 % of its charge) and the 10 TeV muon at 0-20 m and 50-100 m, where its order 0 is 0.93-0.95 of the MC near the track."
cases = [
  "photon-mc-matrix/electron-10GeV",
  "photon-mc-matrix/electron-100GeV",
  "photon-mc-matrix/electron-1TeV",
  "photon-mc-matrix/electron-10TeV",
  "photon-mc-matrix/pion-10GeV",
  "photon-mc-matrix/pion-100GeV",
  "photon-mc-matrix/pion-1TeV",
  "photon-mc-matrix/muon-100GeV",
  "photon-mc-matrix/muon-1TeV-check",
  "photon-mc-matrix/muon-10TeV",
  "photon-mc-matrix/nue-cc",
  "photon-mc-matrix/numu-cc",
  "photon-mc-matrix/electron-100GeV-outside",
  "photon-mc-matrix/electron-100GeV-down",
]
how-to-run = """
python experiments/photon_mc.py NAME --orders --run N [--suppression K] for N = 0..R-1 (NTSim environment; runs are independent and may run in parallel), then PYTHONPATH=src python experiments/run.py run 'photon-mc-matrix/*'
"""
inputs = [
  "the events of experiments/regenerate_inputs.py listed in harness/cases_mcmatrix.py MATRIX (runs and photon_suppression per event)",
  """
NTSim: CherenkovGenerator (photon yield per true step length, band 350-600 nm) -> MCPhotonPropagator (HG, n_scatterings=30) -> SmartRayTracer with scattering orders, clusters 1-5; photon stages seeded per run
""",
]
notes = [
  "OM distance: to the nearest start, middle or end point of the emitting steps.",
  "The Monte-Carlo error of a bin is the run-to-run spread of its charge divided by sqrt(runs).",
  "The 10 TeV events use photon_suppression 10 (Poisson 1/10 of the photons, weight 10): unbiased, larger statistical error.",
]

