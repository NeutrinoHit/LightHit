id = "finite-receiver-order0"
title = "Order 0 on the OM sphere instead of its centre (BallisticIntervalConfig.finite_receiver_m)"
area = "core"
question = """
Why does order 0 near a muon disagree with the photon Monte Carlo (OM 267 at 1.76 m: 63.6 against 58.1 +- 0.5 pe; OM 268 1.40 against 0.55; OM 266 0.02 against 0.17), and what does the finite OM change elsewhere?
"""
kind = "alternative-option"
status = "default"
verdict = "The point receiver samples the thin conical shells of short steps; on the OM sphere (within 20 m) order 0 of the muon passing OM 267 is 59.70 pe (57.92 with the chord yields of NTSim's generator) against MC 58.10 +- 0.49, OM 266 0.171 against 0.172 +- 0.017, OM 268 0.571 against 0.555 +- 0.038; beyond 20 m the point stays (order-0 error per OM 3-11% median, up to 98% on dim OMs), shower routes are bitwise unchanged and the default routes keep their time."
baseline = "default-shower-route"
cases = [
  "finite-receiver-order0/far-electron-100GeV",
  "finite-receiver-order0/far-muon-100GeV",
  "finite-receiver-order0/far-nue-cc",
  "finite-receiver-order0/far-pion-100GeV",
  "finite-receiver-order0/muon-near-om-mc",
]
how-to-run = """
python experiments/photon_mc.py muon-near-om --orders --run N (NTSim environment, N = 0..30), then PYTHONPATH=src python experiments/run.py run 'finite-receiver-order0/*'
"""
inputs = [
  "regenerated muon-near-om: 6 GeV muon passing OM 267 at 1.76 m",
  """
inputs/mc/muon-near-om-run<N>-hits.npz with the scattering order of every hit (31 runs, photon_mc.py --orders)
""",
  "bundle Geant4 100 GeV electron (event 5); regenerated pion-100GeV, nue-cc, muon-100GeV",
]
notes = [
  """
At OM 267 the point receiver had 39.2 pe from one 8.5 cm muon step whose cone passes the OM centre and 16.5 pe from one delta-electron step at 3.6 m (about 2 pe on the sphere). Decomposition of the 5.5 pe: point -> sphere -3.9 pe, true step length -> chord -1.8 pe, the rest within the MC error.
""",
  """
Independent check: rays from every emission point and wavelength crossing the 0.216 m sphere (Gauss in step position, azimuth interval of the cone hitting the sphere, spectral panels): OM 267 59.65 pe with attenuation to the ray's closest approach to the centre (LightHit 59.70), 60.54 pe with attenuation to the entry point as in NTSim's ray tracer; far OMs of showers agree within 0.1 %.
""",
  """
NTSim's CherenkovGenerator emits along the chord of a step, LightHit's source along the true Geant4 step length: the delta electrons of muon-near-om have 7.09 m true path and 5.88 m chord.
""",
  """
Pairs within 20 m only: the sphere everywhere costs 10-14 times the order-0 time (a far short step reaches the sphere over most of the spectrum). With the default 20 m the shower inputs and muon-100GeV are bitwise unchanged; muon-1TeV changes OM 1241 (18.7 m) by +0.0073 pe, muon-300GeV by +0.0016 pe, muon-1TeV-seed43 (6.3 m) its order 0 by +9 %.
""",
  """
The compiled kernel no longer allocates arrays per spectral panel: the point receiver is bitwise the earlier result and about 20 % faster (100 GeV electron, all OMs: 5.5 -> 4.2 s).
""",
]

[code]
modules = [
  "lighthit.ballistic_interval",
  "lighthit._ballistic_interval_numba",
]
functions = ["ballistic_interval", "_support", "_semicircle_cdf", "_integral"]
options = [
  "BallisticIntervalConfig.finite_receiver_m=20 (default) | 0 (point receiver) | inf (sphere everywhere)",
]
scripts = ["experiments/photon_mc.py"]
tests = ["tests/test_ballistic_finite_receiver.py"]

