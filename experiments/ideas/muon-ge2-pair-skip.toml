id = "muon-ge2-pair-skip"
title = "Omit weak secondary packet-OM pairs of order >=2 by a prediction"
area = "muon"
question = "Effect of ge2_skip_epsilon=1e-3 (a prediction, not a bound)."
kind = "alternative-option"
status = "default"
verdict = "Without ge2_skip_epsilon the 300 GeV order >=2 changes from bias 0.702%, L1 0.416%, worst OM 0.204% to 0.710%, 0.415%, 0.211% (the 1 TeV reference has no order >=2), at 1.20x (1 TeV) and 1.04x (300 GeV) the default wall time."
baseline = "default-muon-route"
cases = [
  "muon-ge2-pair-skip/muon-1TeV-no-skip",
  "muon-ge2-pair-skip/muon-300GeV-no-skip",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'muon-ge2-pair-skip/*'"
inputs = [
  "bundle 1 TeV muon + ancestry",
  "regenerated 300 GeV muon (bit-identical regeneration checked on the 1 TeV event)",
  """
reference-muon/<input> (orders 0+1 of all original steps by the grouped per-band prompt without screen, order >=2 per band cloud-in-cell, on the OMs of the default route)
""",
]
notes = []

[code]
modules = ["lighthit.muon.joint_muon", "lighthit.muon.point_ge2"]
functions = []
options = [
  "JointMuonConfig.ge2_skip_epsilon=1e-3, ge2_skip_safety=3, ge2_skip_near_factor=3",
]
scripts = []
tests = []

