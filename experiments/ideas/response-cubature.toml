id = "response-cubature"
title = """
Learned positive spectral cubature for the stationary order-1 charge (lighthit.experimental.spectral_response_basis)
"""
area = "muon"
question = """
Can 17 positive wavelength nodes replace the 82-node spectral quadrature for the order-1 charge?
"""
kind = "table-builder"
status = "used-by-default"
verdict = "The 17-node learned cubature reproduces the 82-node order-1 charge of the active OMs of the 1 TeV and 300 GeV muons to 2.8e-4 relative and order-1 bins to 0.63% L1 (total charge 9.6e-5, total bins 0.24%), and in the fit check to <= 7.8e-5 in charge in 0.13 s vs 0.63 s."
cases = ["response-cubature/check-1TeV-300GeV", "response-cubature/fit"]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'response-cubature/*'"
inputs = [
  "bundle 1 TeV muon (= the old muon1000.npz, sha256 e472ed6b...) and ancestry",
  """
regenerated 300 and 3000 GeV muons (same generator and seed as benchmark_long_muon.py generate; analyze_muon_secondaries.py --capture-source confirmed identical steps)
""",
]
notes = [
  """
Used to build the beta < 1 order-1 table first-beta-charge.npz (its metadata records cubature_sha256 49cefe0b... and 17 spectral nodes); no runtime caller.
""",
]

[code]
modules = ["lighthit.experimental.spectral_response_basis"]
functions = ["fit_response_cubature", "ResponseCubature"]
options = [
  """
transport_universal_primary(first_cubature=...) (default None; MuonTransport does not pass it)
""",
]
scripts = [
  "tools/tables/build_response_cubature.py",
  "scripts/shower_basis/check_joint_response_basis.py",
]
tests = ["tests/test_spectral_response_basis.py"]

