id = "charge-preview"
title = """
Coarse per-OM preview from zero-frequency operator lanes (lighthit.experimental.charge_preview)
"""
area = "muon"
question = """
An independent coarse q0/q1/>=2 estimate for OM screening, using a first-collision pack extracted from the RTE tables.
"""
kind = "alternative-option"
status = "superseded-by:positive-fluence-preview"
verdict = "On the 1 TeV muon the total-charge preview at margin 2 kept all 31 reference-active OMs among 35 candidates (prompt-only screen missed 3) with no negative charges in 29.9 s; the positive-fluence screen at margin 1 also missed none with 42 candidates in 8.3 s."
cases = ["charge-preview/first-collision-pack", "charge-preview/preview-1TeV"]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'charge-preview/*'"
inputs = [
  "bundle 1 TeV muon (= the old muon1000.npz, sha256 e472ed6b...) and ancestry",
  """
regenerated 300 and 3000 GeV muons (same generator and seed as benchmark_long_muon.py generate; analyze_muon_secondaries.py --capture-source confirmed identical steps)
""",
]
notes = []

[code]
modules = [
  "lighthit.experimental.charge_preview",
  "lighthit.experimental.detector_tree",
]
functions = ["charge_preview", "ChargePreviewConfig"]
options = []
scripts = [
  "scripts/shower_basis/probe_shower_first_cache.py",
  "scripts/shower_basis/probe_charge_preview.py",
]
tests = ["tests/test_charge_preview.py", "tests/test_detector_tree.py"]

