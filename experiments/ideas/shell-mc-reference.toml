id = "shell-mc-reference"
title = "Track-length shell Monte Carlo (lighthit.experimental.shell_mc) and absorption derivatives"
area = "core"
question = """
Independent MC of shell-averaged fluence per order; numerical resolution and absorption dependence against the RTE tables.
"""
kind = "reference"
status = "tool"
verdict = "The shell MC is numerically resolved: doubling the quadrature order changes results by 4.7e-12 standard errors, halving the shell width by 0.66 SE and extending the path cutoff to 1500 m by 1.37 SE; absorption-derivative z-scores stay within 0.98."
cases = ["shell-mc-reference/absorption", "shell-mc-reference/resolution"]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'shell-mc-reference/*'"
inputs = ["synthetic media and detectors built by the script (no bundle input)"]
notes = [
  """
verify_absorption.py hard-codes a base_commit (3ba25b7...) that is not in this repository's history; it is only written to the report.
""",
]

[code]
modules = [
  "lighthit.experimental.shell_mc",
  "lighthit.experimental.stationary_modes",
]
functions = []
options = []
scripts = ["scripts/verify_absorption.py", "scripts/check_shell_resolution.py"]
tests = ["tests/test_shell_mc.py", "tests/test_stationary_modes.py"]

