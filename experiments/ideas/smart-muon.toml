id = "smart-muon"
title = """
Earlier adaptive muon route: preview + selection + muon_components (lighthit.experimental.smart_muon)
"""
area = "muon"
question = "The adaptive route before lighthit.muon: cost and accuracy against the muon reference."
kind = "alternative-option"
status = "superseded-by:default-muon-route"
verdict = "Against reference-muon the earlier adaptive route has order-1 bias +0.11%, L1 0.72% and order-0 L1 35.4% (1 TeV), order >=2 L1 3.0% (300 GeV), at 5.81x and 3.98x the default wall time."
cases = [
  "smart-muon/muon-1TeV",
  "smart-muon/muon-300GeV",
  "smart-muon/script-1TeV",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'smart-muon/*'"
inputs = [
  "bundle 1 TeV muon (= the old muon1000.npz, sha256 e472ed6b...) and ancestry",
  """
regenerated 300 and 3000 GeV muons (same generator and seed as benchmark_long_muon.py generate; analyze_muon_secondaries.py --capture-source confirmed identical steps)
""",
]
notes = []

[code]
modules = ["lighthit.experimental.smart_muon", "lighthit.muon.adaptive_screen"]
functions = ["transport_smart_muon"]
options = []
scripts = ["scripts/shower_basis/run_smart_muon.py"]
tests = []

