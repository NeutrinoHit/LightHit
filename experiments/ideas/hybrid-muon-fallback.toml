id = "hybrid-muon-fallback"
title = """
NTSim fallback for a muon: transport_hybrid with ShowerBasis(track_uid, spectral_fusion=True), 33 frequencies
"""
area = "routes"
question = """
What NTSim computes for a muon when the muon route is off or unavailable: accuracy and cost against the muon reference.
"""
kind = "alternative-option"
status = "superseded-by:default-muon-route"
verdict = "Against reference-muon, NTSim's muon fallback on the 1 TeV muon has order-0 L1 35.4% (worst OM 208%), order-1 bias -0.09%, total L1 21.7%, at 1067 s (23.8x default); on the 300 GeV muon order >=2 L1 3.18%, total L1 16.0%, at 490 s (8.5x)."
cases = ["hybrid-muon-fallback/muon-1TeV", "hybrid-muon-fallback/muon-300GeV"]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'hybrid-muon-fallback/*'"
inputs = ["bundle 1 TeV muon; regenerated 300 GeV muon"]
notes = [
  """
Reproduces ntsim/LightTransport/LightHitTransport.py _transport with hybrid_ge2_basis='auto' and no other expert option.
""",
]

[code]
modules = ["lighthit.shower_basis", "lighthit._shower_basis"]
functions = ["TransportKernel.transport_hybrid"]
options = [
  "ShowerBasis(track_uid=<primary>, spectral_fusion=True)",
  "frequency_nodes=33",
]
scripts = []
tests = []

