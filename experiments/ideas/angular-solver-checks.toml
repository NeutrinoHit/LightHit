id = "angular-solver-checks"
title = """
Numerical checks of the k-space angular solver, spatial inversion, Fourier signs and the spectral RTE
"""
area = "core"
question = """
Do the tridiagonal angular system with exact free tail, the multipole inversion, the sign conventions and the spectral solve pass their independent checks?
"""
kind = "validation"
status = "used-by-default"
verdict = "All four synthetic checks report checks_failed none: tridiagonal vs dense solves agree to 3.5e-16, reciprocity holds to 3.5e-16, and the cache is exact on grid (2.3e-15) with 1.7e-3 relative error off grid for finite-L order 1."
cases = [
  "angular-solver-checks/angular-system",
  "angular-solver-checks/fourier-adjoint",
  "angular-solver-checks/scattering-orders",
  "angular-solver-checks/spectral-rte",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'angular-solver-checks/*'"
inputs = ["synthetic media and detectors built by the script (no bundle input)"]
notes = [
  "Every table of the routes is built by lighthit.angular (docs/README.md).",
]

[code]
modules = [
  "lighthit.angular",
  "lighthit._angular_numba",
  "lighthit.cache",
  "lighthit.green",
  "lighthit.single",
]
functions = []
options = []
scripts = [
  "scripts/run_angular_system_example.py",
  "scripts/run_fourier_adjoint_example.py",
  "scripts/run_scattering_orders_example.py",
  "scripts/run_spectral_rte_example.py",
]
tests = [
  "tests/test_angular.py",
  "tests/test_angular_numba.py",
  "tests/test_cache.py",
  "tests/test_green.py",
]

