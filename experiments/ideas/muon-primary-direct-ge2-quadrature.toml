id = "muon-primary-direct-ge2-quadrature"
title = """
Direct order >=2 of primary pieces outside the disk atlas: Filon panels vs fixed Gauss vs adaptive
"""
area = "muon"
question = """
Accuracy and cost of the direct primary >=2 quadrature MuonTransport selects ('filon') against 'fixed12' (function default) and 'adaptive'.
"""
kind = "alternative-option"
status = "default"
verdict = "'fixed12' and 'adaptive' change the order >=2 charge against the route's 'filon' by 1.6e-14 (1 TeV) and 1.1e-13 (300 GeV) relative, the 300 GeV backend check shows zero charge and bin difference, and wall ratios are 0.93-1.22x."
baseline = "default-muon-route"
cases = [
  "muon-primary-direct-ge2-quadrature/backends-300GeV",
  "muon-primary-direct-ge2-quadrature/backward-filon-holdout43",
  "muon-primary-direct-ge2-quadrature/muon-1TeV-adaptive",
  "muon-primary-direct-ge2-quadrature/muon-1TeV-fixed12",
  "muon-primary-direct-ge2-quadrature/muon-300GeV-adaptive",
  "muon-primary-direct-ge2-quadrature/muon-300GeV-fixed12",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'muon-primary-direct-ge2-quadrature/*'"
inputs = [
  "bundle 1 TeV muon + ancestry",
  "regenerated 300 GeV muon (bit-identical regeneration checked on the 1 TeV event)",
  """
reference-muon/<input> (orders 0+1 of all original steps by the grouped per-band prompt without screen, order >=2 per band cloud-in-cell, on the OMs of the default route)
""",
]
notes = []

[code]
modules = ["lighthit.muon.universal_primary", "lighthit.muon.filon_ge2"]
functions = []
options = [
  """
transport_universal_primary(direct_ge2_quadrature='filon') in MuonTransport; function default 'fixed12'
""",
]
scripts = [
  "scripts/shower_basis/probe_direct_ge2_backend.py",
  "scripts/shower_basis/probe_backward_filon.py",
  "scripts/shower_basis/run_primary_filon_check.sh",
]
tests = ["tests/test_filon_ge2.py"]

