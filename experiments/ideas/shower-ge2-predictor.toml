id = "shower-ge2-predictor"
title = "Predicted zero-frequency order >=2 charge for the OM selection"
area = "shower"
question = "Do the predictor's safety factor and cell size change the active set or the charges?"
kind = "alternative-option"
status = "default"
verdict = "An 8 m predictor cell leaves active sets and metrics unchanged (electron order >=2 bias -0.0038% vs -0.0035%) at 1.00x wall; safety factor 1 keeps the same active OMs but shifts electron order-1 bias from -0.504% to -0.565% and costs 1.21x and 1.12x wall."
baseline = "default-shower-route"
cases = [
  "shower-ge2-predictor/electron-100GeV-cell-8m",
  "shower-ge2-predictor/electron-100GeV-safety-1",
  "shower-ge2-predictor/pion-100GeV-cell-8m",
  "shower-ge2-predictor/pion-100GeV-safety-1",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'shower-ge2-predictor/*'"
inputs = [
  "bundle Geant4 100 GeV electron (event 5)",
  "regenerated pion-100GeV",
  """
reference-shower/<input> (original-step orders 0+1, per-band order >=2, on the OMs of the default route)
""",
]
notes = [
  "A predicted value never activates an OM; with safety 1 more OMs rely on the prediction.",
]

[code]
modules = ["lighthit.shower.ge2", "lighthit.shower.api"]
functions = []
options = ["ShowerConfig.predictor_safety=2.0, predictor_cell_m=2.0 (defaults)"]
scripts = []
tests = []

