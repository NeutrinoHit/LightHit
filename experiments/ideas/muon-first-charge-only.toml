id = "muon-first-charge-only"
title = "Charge-only order-1 integral for slow primary steps"
area = "muon"
question = """
Is first_scattering_charge_only exact against the full physical-time integral on stopping-muon tails?
"""
kind = "validation"
status = "used-by-default"
verdict = "On a 376-element, 10.25 m stopping tail of the 300 GeV muon (beta cut 0.999) the charge-only order-1 integral matches the full physical-time integral to <= 4.8e-9 relative on three OMs."
cases = ["muon-first-charge-only/300GeV-tail"]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'muon-first-charge-only/*'"
inputs = [
  "bundle 1 TeV muon (= the old muon1000.npz, sha256 e472ed6b...) and ancestry",
  """
regenerated 300 and 3000 GeV muons (same generator and seed as benchmark_long_muon.py generate; analyze_muon_secondaries.py --capture-source confirmed identical steps)
""",
]
notes = [
  """
probe_stationary_path_gauss.py needs residual primary groups (groups.json/groups.npz) whose generator is not in the repository: that part is not reproducible.
""",
]
not_reproducible_parts = [
  "probe_stationary_path_gauss.py: needs residual primary groups (groups.json, groups.npz) whose generator is not in the repository.",
]

[code]
modules = ["lighthit.muon.first_charge_only"]
functions = ["first_scattering_charge_only"]
options = []
scripts = [
  "scripts/shower_basis/probe_first_charge_only.py",
  "scripts/shower_basis/probe_stationary_path_gauss.py",
]
tests = ["tests/test_first_charge_only.py"]

