id = "prompt-vs-full-order1"
title = "Physical-time order 1 (prompt) against the order 1 of the full RTE tables"
area = "core"
question = """
How far is the finite-L order 1 of the full route from the direct physical-time order 1, and does it converge with (L, L_s)?
"""
kind = "validation"
status = "tool"
verdict = "Full-table order 1 at (L, L_s) = (12,16), (24,32), (36,48) gives 3.95, 3.64 and 3.29 pe against 3.24 pe (ring reference) for a shower and 1.024, 1.051, 1.062 pe against 1.058 pe for a track; on the BGVD 100 GeV electron one prompt call takes 5.6 s against 368 s for the full method."
cases = [
  "prompt-vs-full-order1/bgvd-benchmark",
  "prompt-vs-full-order1/refinement",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'prompt-vs-full-order1/*'"
inputs = [
  "synthetic media and detectors built by the script (no bundle input)",
  """
bundle bgvd-model/ and 100 GeV electron; 321-frequency tables ($LIGHTHIT_RTE_CACHE_321, not in the bundle) for the 'full' method
""",
]
notes = []
not_reproducible_parts = [
  "prompt_benchmark.py, case 'muon': the Geant4 muon HDF5 it read (--g4-muon) is neither in the data bundle nor elsewhere on the measuring machine.",
]

[code]
modules = ["lighthit.prompt", "lighthit.transport"]
functions = ["transport_prompt", "TransportKernel.transport"]
options = []
scripts = ["scripts/prompt_full_refinement.py", "scripts/prompt_benchmark.py"]
tests = []

