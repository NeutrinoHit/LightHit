id = "directional-om-kernel"
title = "Exact directional OM kernel (m-block resolvent rows, DirectionalCache) and its identities"
area = "core"
question = """
Parity, bipolar factorisation, dense cross-check, cost relative to the m=0 path, directionality of the result.
"""
kind = "validation"
status = "used-by-default"
verdict = "Odd-parity coefficients are exactly 0, the dense cross-check error falls to 5.9e-11 at degree 12, order charges agree with crossing MC within 1.62 sigma, and the Numba directional apply takes 0.83 s vs 0.073 s for the m=0 path (9.66x faster than NumPy)."
cases = [
  "directional-om-kernel/benchmark",
  "directional-om-kernel/bgvd-smoke",
  "directional-om-kernel/bipolar-identity",
  "directional-om-kernel/directionality",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'directional-om-kernel/*'"
inputs = [
  "synthetic media and detectors built by the script (no bundle input)",
  "bundle bgvd-model/ package (smoke_bgvd_directional.py)",
]
notes = [
  "The routes read directional tables of the bundle (rte-cache) built by this kernel.",
]

[code]
modules = [
  "lighthit.directional",
  "lighthit._directional_numba",
  "lighthit.experimental.directional_reference",
  "lighthit.experimental.crossing_mc",
  "lighthit.experimental.stationary_modes",
  "lighthit.experimental.shell_mc",
]
functions = [
  "DirectionalCache",
  "CouplingTable",
  "directional_response",
  "khat_quadrature_response",
]
options = []
scripts = [
  "scripts/probe_bipolar_identity.py",
  "scripts/benchmark_directional.py",
  "scripts/verify_directionality.py",
  "scripts/smoke_bgvd_directional.py",
]
tests = [
  "tests/test_directional.py",
  "tests/test_directional_numba.py",
  "tests/test_crossing_mc.py",
  "tests/test_stationary_modes.py",
]

