id = "shower-order1-band-fusion"
title = "Order 1 of showers with the nine bands fused into one pencil set"
area = "shower"
question = """
Does band fusion (fuse_bands=True, 96 pixels per face) change order 1 against original steps, and what does it save? Also the muon route's 64-pixel face.
"""
kind = "alternative-option"
status = "default"
verdict = "Against original steps, fused bands with 96 pixels (default) give order-1 bias -0.50%, L1 1.14% (electron) and L1 10.6% (pion); 64 pixels give -0.66%, 1.15% and 17.2% at 0.87x/0.95x wall; per-band gives -1.72%, 1.93% and 26.9% at 1.62x/1.77x."
baseline = "default-shower-route"
cases = [
  "shower-order1-band-fusion/electron-100GeV-fused-64",
  "shower-order1-band-fusion/electron-100GeV-per-band",
  "shower-order1-band-fusion/pion-100GeV-fused-64",
  "shower-order1-band-fusion/pion-100GeV-per-band",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'shower-order1-band-fusion/*'"
inputs = [
  "bundle Geant4 100 GeV electron (event 5)",
  "regenerated pion-100GeV",
  """
reference-shower/<input> (original-step orders 0+1, per-band order >=2, on the OMs of the default route)
""",
]
notes = [
  """
The docstring of shower/api.py _default_prompt says 96/192 was more accurate than 64/192 against original steps on three controls; that is a statement of the code, measured again here.
""",
]

[code]
modules = [
  "lighthit.prompt",
  "lighthit._prompt_numba",
  "lighthit.muon.secondary_first",
]
functions = []
options = [
  "PromptConfig.fuse_bands (route: True; PromptConfig default False)",
  "PromptConfig.fused_pixel_face (route: 96; muon route secondaries: 64)",
]
scripts = []
tests = ["tests/test_shower_route.py", "tests/test_prompt.py"]

