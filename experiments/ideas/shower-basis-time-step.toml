id = "shower-basis-time-step"
title = "Emission-phase lattice step of the order >=2 basis"
area = "shower"
question = "Convergence of order >=2 in the phase lattice step (0.01 / 0.02 / 0.1 ns)."
kind = "alternative-option"
status = "default"
verdict = "A 0.01 ns phase step gives the same order >=2 as the 0.02 ns default (electron L1 0.3090%, pion 0.0436%); 0.1 ns gives 0.3005% and 0.0545% against 0.3088% and 0.0439%, with unchanged charge bias; wall 1.01x for both."
baseline = "default-shower-route"
cases = [
  "shower-basis-time-step/electron-100GeV-0.01ns",
  "shower-basis-time-step/electron-100GeV-0.1ns",
  "shower-basis-time-step/pion-100GeV-0.01ns",
  "shower-basis-time-step/pion-100GeV-0.1ns",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'shower-basis-time-step/*'"
inputs = [
  "bundle Geant4 100 GeV electron (event 5)",
  "regenerated pion-100GeV",
  """
reference-shower/<input> (original-step orders 0+1, per-band order >=2, on the OMs of the default route)
""",
]
notes = []

[code]
modules = ["lighthit.shower_basis", "lighthit._shower_basis"]
functions = []
options = ["ShowerBasis.time_step_ns=0.02 (default)"]
scripts = []
tests = []

