id = "axial-source-route"
title = """
Axial 3-D cloud-in-cell source on multipole tables (TransportKernel._transport_axial) and its fast compiler
"""
area = "core"
question = """
Accuracy of the axial lattice source and the cell-GEMM compiler against direct element sums; reuse for a rigid re-pose.
"""
kind = "alternative-option"
status = "tool"
verdict = "On the 100 GeV electron the axial lattice source matches direct element sums within 0.69% (order 1) and 0.18% (order >=2) in charge on 6 controls; the cell-GEMM compiler agrees to 4.0e-14 and reuses the source on re-pose; blocked apply is identical (1.7e-15) at 0.45 of the time."
cases = [
  "axial-source-route/axial-3d",
  "axial-source-route/axial-bins",
  "axial-source-route/blocked-apply",
  "axial-source-route/fast-compiler",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'axial-source-route/*'"
inputs = [
  """
bundle Geant4 100 GeV electron (HDF5, event 5); the script builds its own small table for lighthit.synthetic_medium()
""",
]
notes = [
  """
kernel.transport takes this path for element sources on isotropic-acceptance detectors; the BGVD OM has a directional acceptance, so the routes do not.
""",
  """
lighthit.experimental.axial_blocked (numpy reordered apply) has no caller and no test; case axial-source-route/blocked-apply measures it.
""",
]

[code]
modules = [
  "lighthit.axial_source",
  "lighthit.axial_fast",
  "lighthit.experimental.axial_blocked",
]
functions = ["compile_axial_source_fast", "PreparedAxialKernel", "AxialSource.of"]
options = []
scripts = [
  "scripts/run_shower_axial.py",
  "scripts/run_shower_axial_bins.py",
  "scripts/benchmark_axial_fast.py",
]
tests = ["tests/test_axial_source.py", "tests/test_axial_fast.py"]

