id = "muon-components"
title = """
Explicit muon route: fitted primary integrals + local secondary packets (lighthit.experimental.muon_components)
"""
area = "muon"
question = """
NTSim --hybrid-muon-components prompt/all, centroid stencil, primary polyline: accuracy and cost.
"""
kind = "alternative-option"
status = "superseded-by:default-muon-route"
verdict = "In NTSim's hybrid runs with muon components, order 1 against reference-muon has bias +0.10%, L1 0.72% (1 TeV) and +0.28%, L1 1.20% (300 GeV), but order 0 L1 is 35.4% and 28.2% and 300 GeV order >=2 L1 3.0-3.2%, at 8.6-10.0x (1 TeV) and 3.0-4.2x (300 GeV) the default wall time."
cases = [
  "muon-components/script-1TeV",
  "ntsim-hybrid-muon-fast/muon-1TeV-prompt",
  "ntsim-hybrid-muon-fast/muon-1TeV-all",
  "ntsim-hybrid-muon-fast/muon-1TeV-all-centroid",
  "ntsim-hybrid-muon-fast/muon-1TeV-all-polyline",
  "ntsim-hybrid-muon-fast/muon-300GeV-prompt",
  "ntsim-hybrid-muon-fast/muon-300GeV-all",
  "ntsim-hybrid-muon-fast/muon-300GeV-all-centroid",
  "ntsim-hybrid-muon-fast/muon-300GeV-all-polyline",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'muon-components/*'"
inputs = [
  "bundle 1 TeV muon (= the old muon1000.npz, sha256 e472ed6b...) and ancestry",
  """
regenerated 300 and 3000 GeV muons (same generator and seed as benchmark_long_muon.py generate; analyze_muon_secondaries.py --capture-source confirmed identical steps)
""",
]
notes = [
  "Shipped in the wheel because NTSim imports it (packaging_filter.REQUIRED_EXPERIMENTAL).",
]

[code]
modules = ["lighthit.experimental.muon_components"]
functions = ["transport_muon_components"]
options = []
scripts = ["scripts/shower_basis/run_muon_components.py"]
tests = ["tests/test_muon_components.py", "tests/test_centroid_stencil.py"]

