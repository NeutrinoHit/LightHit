id = "early-source-selection"
title = "Early spatial pruning of source points in the basis compiler (+ local rank compression)"
area = "muon"
question = """
Is pruning source points to OMs within 300 m before compilation bitwise identical, and what does it save?
"""
kind = "validation"
status = "used-by-default"
verdict = "Pruning source points to OMs within 300 m is bitwise identical on the 1 TeV muon (charge, spectrum and bin differences 0) and reduces compiled rows from 72056 to 40522 and compile time from 3.94 s to 2.92 s; apply stays at 21.9 s."
cases = ["early-source-selection/1TeV"]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'early-source-selection/*'"
inputs = [
  "bundle 1 TeV muon (= the old muon1000.npz, sha256 e472ed6b...) and ancestry",
  """
regenerated 300 and 3000 GeV muons (same generator and seed as benchmark_long_muon.py generate; analyze_muon_secondaries.py --capture-source confirmed identical steps)
""",
]
notes = []

[code]
modules = ["lighthit._shower_basis", "lighthit.experimental.local_source_rank"]
functions = []
options = ["compile_axial_slices(prune_selected=True) (library default)"]
scripts = ["scripts/shower_basis/probe_early_source_selection.py"]
tests = ["tests/test_local_source_rank.py"]

