id = "default-muon-route"
title = "Muon route: lighthit.muon.MuonTransport"
area = "routes"
question = "What does the default muon route cost and how accurate is it on standard muons?"
kind = "route"
status = "default"
verdict = "Against reference-muon the 1 TeV muon has order-1 bias +2.32%, L1 2.50% (orders 0+1 only) in 44.8 s; the 300 GeV muon order-1 bias +3.24%, L1 2.97%, order >=2 bias +0.70%, L1 0.42% in 57.4 s; the 100 GeV muon order-1 bias +4.28%, L1 4.42%, order >=2 bias +0.46%, L1 0.53%, total L1 1.33% in 34.2 s."
cases = [
  "default-muon-route/muon-100GeV",
  "default-muon-route/muon-1TeV",
  "default-muon-route/muon-1TeV-seed43",
  "default-muon-route/muon-3000GeV",
  "default-muon-route/muon-300GeV",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'default-muon-route/*'"
inputs = [
  "bundle: tables (rte-cache, ge2-pack, muon/*), events/muon-1TeV-steps.npz + ancestry",
  "regenerated: muon-100GeV, muon-300GeV, muon-3000GeV, muon-1TeV-seed43",
]
notes = [
  """
The route raises ValueError('primary enters unvalidated inner >=2 radius ...') when the infinite line of any primary polyline piece passes within 3.01 m of an OM inside the >=2 reach (src/lighthit/muon/universal_primary.py, rho is the distance to the line, not to the piece).
""",
  """
Measured on the regenerated 100 GeV muon (2026-10-15): it stops 93 m from the nearest OM, yet the lines of three tail pieces of 0-6 cm pass 0.96-1.44 m from OMs 146-341 m away, so MuonTransport raises; EventTransport then runs the shower route for it (route_fallbacks).
""",
  "Executed functions: docs/usage-map.md (scenarios muon, event, ntsim-muon, ntsim-numu-cc).",
]

[code]
modules = [
  "lighthit.muon.api",
  "lighthit.muon.joint_muon",
  "lighthit.muon.universal_primary",
  "lighthit.muon.primary_polyline",
  "lighthit.muon.preview",
  "lighthit.muon.adaptive_screen",
  "lighthit.muon.secondary_first",
  "lighthit.muon.muon_packets",
  "lighthit.muon.packet_skip",
  "lighthit.muon.joint_source",
  "lighthit.muon.point_ge2",
  "lighthit.muon.point_ge2_blas",
  "lighthit.muon.filon_ge2",
  "lighthit.muon.first_charge_only",
  "lighthit.muon.muon_integral",
  "lighthit.muon.track_first_primitive",
  "lighthit.muon.track_ge2_primitive",
  "lighthit.muon.first_charge_beta_atlas",
  "lighthit.muon.ge2_charge_beta_atlas",
  "lighthit.muon.positive_fluence",
]
functions = [
  "MuonTransport.__call__",
  "transport_joint_muon",
  "transport_universal_primary",
]
options = [
  """
JointMuonConfig() defaults; AdaptiveScreenConfig(scatter_margin=2); primary_options fixed in MuonTransport._event: direct_ge2_quadrature='filon', q1_charge_gauss_order=6, beta atlases, fallback_pack=ge2_pack
""",
]
scripts = []
tests = [
  "tests/test_joint_muon.py",
  "tests/test_universal_primary.py",
  "tests/test_adaptive_screen.py",
]

