id = "muon-adaptive-screen"
title = "Adaptive OM selection of the muon route (scatter margin)"
area = "muon"
question = "Does the margin 2 used by MuonTransport (AdaptiveScreenConfig default 4) miss OMs?"
kind = "alternative-option"
status = "default"
verdict = "With margin 4 instead of the route's margin 2 the active sets are unchanged and the active-OM charges equal the default (differences only on sub-threshold OMs; the same metrics as the all-OMs-detailed run: 1 TeV order-1 bias 2.23% vs 2.32%), at 1.12x and 1.15x wall."
baseline = "default-muon-route"
cases = [
  "muon-adaptive-screen/muon-1TeV-margin-4",
  "muon-adaptive-screen/muon-300GeV-margin-4",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'muon-adaptive-screen/*'"
inputs = [
  "bundle 1 TeV muon + ancestry",
  "regenerated 300 GeV muon (bit-identical regeneration checked on the 1 TeV event)",
  """
reference-muon/<input> (orders 0+1 of all original steps by the grouped per-band prompt without screen, order >=2 per band cloud-in-cell, on the OMs of the default route)
""",
]
notes = [
  """
muon-receivers-all-detailed computes every OM of the default run in detail and isolates what preview and selection change.
""",
]

[code]
modules = ["lighthit.muon.adaptive_screen", "lighthit.muon.preview"]
functions = []
options = [
  "AdaptiveScreenConfig(scatter_margin=2) in MuonTransport; dataclass default 4",
]
scripts = []
tests = ["tests/test_adaptive_screen.py"]

