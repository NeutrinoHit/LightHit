id = "joint-source-ge2"
title = "Secondary order >=2 from joint source histograms on point RTE sources"
area = "muon"
question = """
Accuracy of joint (z, tau, transverse, mu) histograms against direct point sources and the axial basis.
"""
kind = "validation"
status = "used-by-default"
verdict = "For one 1 TeV secondary shower packet, joint (z, t) histograms at 0.25, 0.5 and 1 give bright-OM L1 3.4%, 4.1% and 5.0% against direct point sources (30.7 s CPU) at 0.27, 0.13 and 0.09 s CPU."
cases = ["joint-source-ge2/packets-1TeV"]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'joint-source-ge2/*'"
inputs = [
  "bundle 1 TeV muon (= the old muon1000.npz, sha256 e472ed6b...) and ancestry",
  """
regenerated 300 and 3000 GeV muons (same generator and seed as benchmark_long_muon.py generate; analyze_muon_secondaries.py --capture-source confirmed identical steps)
""",
]
notes = [
  """
The optional --compiler-baseline (a frozen earlier compiler) is not recorded; that paired check is not reproducible.
""",
]
not_reproducible_parts = [
  "probe_joint_ge2 --compiler-baseline: the frozen earlier compiler of that paired check is not recorded.",
]

