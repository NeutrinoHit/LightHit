id = "muon-ge2-operator"
title = "Secondary order >=2 operator: BLAS float32 batches vs float64 vs scalar point apply"
area = "muon"
question = "Precision and speed of the order >=2 point operator."
kind = "alternative-option"
status = "default"
verdict = "float64 BLAS and the scalar point apply change the order >=2 charge by 3.5e-8 (1 TeV) and 1.4e-8 (300 GeV) relative to the default float32 BLAS; float64 runs at 1.03x/1.00x and scalar at 2.18x/1.66x the default wall time."
baseline = "default-muon-route"
cases = [
  "muon-ge2-operator/muon-1TeV-float64",
  "muon-ge2-operator/muon-1TeV-scalar",
  "muon-ge2-operator/muon-300GeV-float64",
  "muon-ge2-operator/muon-300GeV-scalar",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'muon-ge2-operator/*'"
inputs = [
  "bundle 1 TeV muon + ancestry",
  "regenerated 300 GeV muon (bit-identical regeneration checked on the 1 TeV event)",
  """
reference-muon/<input> (orders 0+1 of all original steps by the grouped per-band prompt without screen, order >=2 per band cloud-in-cell, on the OMs of the default route)
""",
]
notes = [
  """
'scalar' is refused by JointMuonConfig unless ge2_batch_points=0 and ge2_blas_precision='float64' (joint_muon.py __post_init__).
""",
]

[code]
modules = ["lighthit.muon.point_ge2_blas", "lighthit.muon.point_ge2"]
functions = []
options = [
  "JointMuonConfig.ge2_operator='blas' (default) | 'scalar'",
  "ge2_blas_precision='float32' (default) | 'float64'",
  "ge2_batch_points=2000",
]
scripts = []
tests = ["tests/test_point_ge2.py", "tests/test_point_ge2_blas.py"]

