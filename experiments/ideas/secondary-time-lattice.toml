id = "secondary-time-lattice"
title = "Emission-time lattice step of the axial basis for secondaries"
area = "muon"
question = """
How coarse can the emission-time lattice of secondary packets be (0.02 / 0.25 / 0.5 ns, linear or cubic)?
"""
kind = "probe"
status = "open"
verdict = "Relative to a 0.02 ns lattice, 0.25 ns gives max bin L1 <= 9.1e-6 (1 TeV) and <= 1.3e-4 (three energies), and 0.5 ns <= 4.8e-4 and <= 6.9e-4, over all secondary packets."
cases = ["secondary-time-lattice/1TeV", "secondary-time-lattice/three-energies"]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'secondary-time-lattice/*'"
inputs = [
  "bundle 1 TeV muon (= the old muon1000.npz, sha256 e472ed6b...) and ancestry",
  """
regenerated 300 and 3000 GeV muons (same generator and seed as benchmark_long_muon.py generate; analyze_muon_secondaries.py --capture-source confirmed identical steps)
""",
]
notes = [
  "Concerns the axial basis (ge2_backend='basis'), not the default joint sources.",
]

[code]
modules = ["lighthit._shower_basis"]
functions = []
options = []
scripts = [
  "scripts/shower_basis/probe_secondary_time_lattice.py",
  "scripts/shower_basis/run_secondary_time_check.sh",
]
tests = []

