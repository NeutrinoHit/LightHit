id = "hybrid-cloud-in-cell"
title = """
TransportKernel.transport_hybrid(ge2_basis=None): per-band order >=2 of the elements (cloud-in-cell)
"""
area = "routes"
question = """
The per-band order >=2 of the original elements on the directional tables: cost, and use as the order >=2 reference.
"""
kind = "reference"
status = "tool"
verdict = "The per-band cloud-in-cell run on the 100 GeV electron takes 151.9 s wall (679.5 s CPU) at default threads and is itself the order >=2 reference (L1 0); on the 100 GeV pion it fails with 'prompt and RTE time origins differ'."
cases = [
  "hybrid-cloud-in-cell/electron-100GeV",
  "hybrid-cloud-in-cell/pion-100GeV",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'hybrid-cloud-in-cell/*'"
inputs = ["bundle tables and electron; regenerated pion-100GeV"]
notes = [
  """
Its order >=2 (on the OMs of the default route, threshold 0) is the order >=2 part of reference-shower and reference-muon.
""",
  """
Orders 0 and 1 come from transport_prompt with the default PromptConfig (nine-node quadrature for order 0).
""",
]

[code]
modules = [
  "lighthit.transport",
  "lighthit.axial_fast",
  "lighthit._directional_numba",
]
functions = ["TransportKernel.transport_hybrid"]
options = [
  "ge2_basis=None, frequency_nodes=65, prompt_config=None (default PromptConfig)",
]
scripts = []
tests = ["tests/test_shower_route.py"]

