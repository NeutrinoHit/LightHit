id = "kernel-transport-full"
title = "TransportKernel.transport: all orders from 321-frequency RTE tables (NTSim --mode full)"
area = "routes"
question = """
Is the full-table route usable on the bundle, and how does it compare with the routes? Includes the wavelength-folded kernels (spectral_folded_cache).
"""
kind = "alternative-option"
status = "tool"
verdict = "On the 100 GeV electron the full-table route has charge bias -2.6% (order 0, frozen cones), -1.6% (order 1) and +0.4% (order >=2) at 41x (frozen), 8.8x (folded) and 44x (spectral) the shower route's wall time; its bins repeat every 335 ns (readout on the 65 table frequencies), so the 805 ns window holds three copies and bin L1 is about 200%."
cases = [
  "kernel-transport-full/electron-100GeV-frozen",
  "kernel-transport-full/electron-100GeV-frozen-folded",
  "kernel-transport-full/electron-100GeV-spectral",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'kernel-transport-full/*'"
inputs = [
  """
bundle 65-frequency directional tables (linked into experiments/results/work so that the folded cache is written there), readout at 321 frequencies
""",
  "bundle electron 100 GeV, frozen (cone at the largest phase index) or spectral cones",
]
notes = [
  """
No default scenario imports lighthit._spectral_fold or lighthit._track_transport (docs/usage-map.md): the routes never take this path.
""",
  """
scripts/prompt_benchmark.py compares transport_prompt with this path; see idea prompt-vs-full-order1.
""",
]

[code]
modules = [
  "lighthit.transport",
  "lighthit.directional",
  "lighthit._directional_numba",
  "lighthit._spectral_fold",
  "lighthit.axial_fast",
  "lighthit.axial_source",
  "lighthit._track_transport",
]
functions = [
  "TransportKernel.transport",
  "TransportKernel._transport_directional",
  "TransportKernel._transport_axial",
  "build_folded_directional",
]
options = [
  """
method='auto'|'isotropic'|'track'|'axial'|'directional' (+ experimental axial_centroid, track_centroid, axial_full, generic with allow_experimental=True)
""",
  "KernelConfig.spectral_folded_cache='auto'|True|False",
]
scripts = []
tests = [
  "tests/test_directional.py",
  "tests/test_track_transport.py",
  "tests/test_spectral_fold.py",
]

