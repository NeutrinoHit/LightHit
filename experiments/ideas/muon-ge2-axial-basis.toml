id = "muon-ge2-axial-basis"
title = "Secondary order >=2 by the axial shower basis instead of joint point sources"
area = "muon"
question = """
The earlier secondary >=2 representation (compile_axial_slices per packet) against joint point sources.
"""
kind = "alternative-option"
status = "rejected"
verdict = "The axial basis for secondary order >=2 gives 300 GeV order >=2 bias +0.708% and L1 0.404% (default +0.702%, 0.416%) with order 1 unchanged, but takes 1076.4 s (18.8x the default) on the 300 GeV muon and 1868.3 s (41.7x) on the 1 TeV muon."
baseline = "default-muon-route"
cases = [
  "muon-ge2-axial-basis/muon-1TeV-basis",
  "muon-ge2-axial-basis/muon-300GeV-basis",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'muon-ge2-axial-basis/*'"
inputs = [
  "bundle 1 TeV muon + ancestry",
  "regenerated 300 GeV muon (bit-identical regeneration checked on the 1 TeV event)",
  """
reference-muon/<input> (orders 0+1 of all original steps by the grouped per-band prompt without screen, order >=2 per band cloud-in-cell, on the OMs of the default route)
""",
]
notes = []

[code]
modules = ["lighthit.muon.joint_muon", "lighthit._shower_basis"]
functions = []
options = [
  """
JointMuonConfig.ge2_backend='joint' (default) | 'basis' (needs ge2_operator='scalar', ge2_batch_points=0, ge2_blas_precision='float64', ge2_skip_epsilon=0)
""",
]
scripts = ["scripts/shower_basis/probe_joint_ge2.py"]
tests = []

