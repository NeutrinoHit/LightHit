id = "kernel-transport-prompt"
title = "TransportKernel.transport_prompt: orders 0 and 1 only (NTSim --mode prompt)"
area = "routes"
question = """
What do orders 0 and 1 cost with the default PromptConfig, and how far is the default PromptConfig from the shower route's settings?
"""
kind = "alternative-option"
status = "tool"
verdict = "With the default PromptConfig, orders 0 and 1 on the 100 GeV electron take 108.3 s (8.91x the shower route) with order-0 bias -8.87%, L1 34.5% and order-1 bias -1.72%, L1 1.93%, against the route's exact order 0 and order-1 -0.50%, L1 1.14%."
cases = ["kernel-transport-prompt/electron-100GeV"]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'kernel-transport-prompt/*'"
inputs = ["bundle electron 100 GeV"]
notes = [
  "The default PromptConfig is not the shower route's (interval ballistic, fused bands).",
  """
PromptTransportResponse has charge_orders_pe/bins_orders_pe, not charge_components_pe, although docs/transport-kernel.md says the three response classes share the reading interface.
""",
]

[code]
modules = ["lighthit.prompt", "lighthit._prompt_numba", "lighthit.ballistic_fast"]
functions = ["TransportKernel.transport_prompt", "prompt.transport_prompt"]
options = [
  """
PromptConfig() defaults: element_method='auto', ballistic_method='quadrature', fuse_bands=False, screen=True
""",
]
scripts = []
tests = ["tests/test_prompt.py"]

