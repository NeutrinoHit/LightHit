id = "shower-basis-track-channel"
title = """
Shower basis with an axial m=0 primary-track channel for muons (ShowerBasis(track_uid=...)), and the cells representation
"""
area = "muon"
question = """
Can a muon go through the shower basis by splitting off its primary track as an axial channel?
"""
kind = "alternative-option"
status = "superseded-by:default-muon-route"
verdict = "For a long NTSim muon the track-channel basis matches the full basis with bitwise-identical prompt orders and active sets, order >=2 bin L1 1.33% globally (bright-OM charge 0.44%); on the 100 GeV muon the basis took 532 s vs 1688 s for cells, and 1785 s on the 1 TeV muon."
cases = [
  "shower-basis-track-channel/muons-cells-vs-basis",
  "shower-basis-track-channel/ntsim-long-muon",
  "shower-basis-track-channel/time-muons",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'shower-basis-track-channel/*'"
inputs = [
  """
regenerated 100 GeV muon and bundle 1 TeV muon (one event each); NTSim + Geant4 for check_long_muon_ntsim.sh
""",
]
notes = [
  "NTSim's fallback for muons still uses this basis (idea hybrid-muon-fallback).",
  "The shower route refuses a ShowerBasis with track_uid.",
]

[code]
modules = ["lighthit.shower_basis"]
functions = ["transport_hybrid_basis"]
options = [
  "ShowerBasis(track_uid, track_cell_m, track_transverse, secondary_cell_m, spectral_fusion)",
  "transport_hybrid_basis(representation='cells')",
]
scripts = [
  "scripts/shower_basis/run_muons.py",
  "scripts/shower_basis/compare_muons.py",
  "scripts/shower_basis/time_muons.py",
  "scripts/shower_basis/verify_ntsim.py",
  "scripts/shower_basis/check_long_muon_ntsim.sh",
]
tests = []

