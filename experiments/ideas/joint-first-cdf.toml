id = "joint-first-cdf"
title = """
Secondary order 1 from reusable pencil CDFs and their universal atlas (first_backend='atlas')
"""
area = "muon"
question = """
Can secondary order 1 come from a joint photon histogram and a universal first-scatter CDF atlas instead of grouped pencils?
"""
kind = "alternative-option"
status = "superseded-by:default-muon-route"
verdict = "The universal first-scatter CDF atlas reproduces the pencil-CDF order 1 to 0.11% in charge and 0.12% in bins, but the 1 TeV muon run with first_backend='atlas' took 11656 s against 48.2 s with the library defaults (grouped pencils); no reference comparison of that run is recorded."
cases = [
  "joint-first-cdf/atlas-1TeV",
  "joint-first-cdf/pencil-cdf-1TeV",
  "joint-first-cdf/route-atlas-1TeV",
  "joint-first-cdf/route-library-defaults-1TeV",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'joint-first-cdf/*'"
inputs = [
  "bundle 1 TeV muon (= the old muon1000.npz, sha256 e472ed6b...) and ancestry",
  """
regenerated 300 and 3000 GeV muons (same generator and seed as benchmark_long_muon.py generate; analyze_muon_secondaries.py --capture-source confirmed identical steps)
""",
]
notes = [
  """
MuonTransport never passes joint_first_atlas, so first_backend='atlas' cannot run through it; run_joint_muon.py calls transport_joint_muon directly.
""",
  "joint_first and joint_first_atlas are not in the wheel.",
]

[code]
modules = [
  "lighthit.experimental.joint_first",
  "lighthit.experimental.joint_first_atlas",
]
functions = ["PencilFirstCDF", "UniversalFirstCDFAtlas"]
options = [
  """
JointMuonConfig(first_backend='atlas', first_skip_epsilon=0, first_fuse_bands=False) + joint_first_atlas=...
""",
]
scripts = [
  "scripts/shower_basis/probe_joint_first.py",
  "scripts/shower_basis/probe_joint_first_atlas.py",
  "scripts/shower_basis/run_joint_muon.py",
]
tests = ["tests/test_joint_first.py", "tests/test_joint_first_atlas.py"]

