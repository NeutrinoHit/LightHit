id = "first-control-variate"
title = """
Primary order 1 by backward Monte Carlo with a beta=1 control variate (lighthit.experimental.prompt_backward)
"""
area = "muon"
question = """
Does a paired backward-MC residual on top of a cached beta=1 base beat plain MC for the slow primary?
"""
kind = "probe"
status = "open"
verdict = "On the 300 GeV muon the beta=1 control variate gives relative charge errors <= 6.9e-5 at 4096 samples per wavelength per OM vs 8.8e-4 to 0.087 for plain MC; the cached-residual variant has 5.6e-4 relative error on OM 1208 with residual-only error 5.2e-5."
cases = [
  "first-control-variate/300GeV",
  "first-control-variate/cached-residual-300GeV",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'first-control-variate/*'"
inputs = [
  "bundle 1 TeV muon (= the old muon1000.npz, sha256 e472ed6b...) and ancestry",
  """
regenerated 300 and 3000 GeV muons (same generator and seed as benchmark_long_muon.py generate; analyze_muon_secondaries.py --capture-source confirmed identical steps)
""",
]
notes = [
  "No route uses Monte Carlo for order 1; the route uses the atlas plus direct integrals.",
]

[code]
modules = ["lighthit.experimental.prompt_backward"]
functions = ["build_tree", "direct_lobes"]
options = []
scripts = [
  "scripts/shower_basis/probe_first_control_variate.py",
  "scripts/shower_basis/probe_cached_first_residual.py",
]
tests = ["tests/test_prompt.py"]

