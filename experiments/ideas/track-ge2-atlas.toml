id = "track-ge2-atlas"
title = "Finite-track order >=2 disk atlas of the primary (beta = 1), table ge2-atlas"
area = "muon"
question = "Can order >=2 of straight beta=1 pieces be read from an event-independent disk atlas?"
kind = "table-builder"
status = "used-by-default"
verdict = "The order >=2 disk atlas matches direct primitives to spectrum L1 <= 0.83%, bins <= 0.74% (mini atlas), the 1 TeV primary on one OM to 0.18% charge, 0.54% bins (0.004 s vs 2.5 s direct), and original steps to 0.17% charge, 1.0% bins."
cases = [
  "track-ge2-atlas/primitive-1TeV",
  "track-ge2-atlas/mini-atlas-1TeV",
  "track-ge2-atlas/primary-atlas-1TeV",
  "track-ge2-atlas/original-step-control-1TeV",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'track-ge2-atlas/*'"
inputs = [
  "bundle 1 TeV muon (= the old muon1000.npz, sha256 e472ed6b...) and ancestry",
  """
regenerated 300 and 3000 GeV muons (same generator and seed as benchmark_long_muon.py generate; analyze_muon_secondaries.py --capture-source confirmed identical steps)
""",
]
notes = []

[code]
modules = ["lighthit.muon.track_ge2_primitive"]
functions = ["DiskTrackGe2Atlas", "cone_point_evaluator"]
options = []
scripts = [
  "scripts/shower_basis/probe_track_ge2_primitive.py",
  "scripts/shower_basis/probe_primary_ge2_original.py",
  "tools/tables/build_track_ge2_atlas.py",
]
tests = ["tests/test_track_ge2_primitive.py"]

