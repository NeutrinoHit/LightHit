id = "universal-primary"
title = """
Primary muon from the frozen atlases (transport_universal_primary) against direct per-OM controls
"""
area = "muon"
question = "Accuracy of the route's primary stage on whole events and on an independent holdout muon."
kind = "validation"
status = "used-by-default"
verdict = "The frozen-atlas primary stage matches direct per-OM controls on the 1 TeV muon to 0.13% in active-OM total charge and 0.21% in bins, and on the seed-43 holdout to 0.049% in charge and 0.061% in bins on original steps (control OM 1240 order 1: 0.52%)."
cases = [
  "universal-primary/charge-check-1TeV",
  "universal-primary/controls-1000GeV",
  "universal-primary/controls-300GeV",
  "universal-primary/controls-holdout43",
  "universal-primary/filon-check-1TeV",
  "universal-primary/original-steps-holdout43",
  "universal-primary/time-check-1TeV",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'universal-primary/*'"
inputs = [
  "bundle 1 TeV muon (= the old muon1000.npz, sha256 e472ed6b...) and ancestry",
  """
regenerated 300 and 3000 GeV muons (same generator and seed as benchmark_long_muon.py generate; analyze_muon_secondaries.py --capture-source confirmed identical steps)
""",
  """
regenerated holdout: 1 TeV muon, seed 43, start (-120, -900, 330) m, direction (0.02, 1, 0.01)
""",
]
notes = []

[code]
modules = ["lighthit.muon.universal_primary"]
functions = ["transport_universal_primary", "DirectGe2"]
options = []
scripts = [
  "scripts/shower_basis/check_universal_primary.py",
  "scripts/shower_basis/compare_universal_primary.py",
  "scripts/shower_basis/check_original_primary_holdout.py",
  "scripts/shower_basis/run_primary_time_check.sh",
  "scripts/shower_basis/run_primary_charge_check.sh",
  "scripts/shower_basis/run_primary_filon_check.sh",
]
tests = ["tests/test_universal_primary.py"]

