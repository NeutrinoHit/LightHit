id = "hybrid-basis-per-band"
title = """
TransportKernel.transport_hybrid(ge2_basis=ShowerBasis()): the previous per-band shower route
"""
area = "routes"
question = """
The per-band shower basis (nine bands, no band fold) against the default shower route: accuracy and speed. It is also NTSim's fallback for showers.
"""
kind = "alternative-option"
status = "superseded-by:default-shower-route"
verdict = "Against reference-shower the per-band route on the 100 GeV electron has order-0 bias -8.87%, L1 34.8% (nine-node quadrature), order-1 bias -1.78%, L1 1.93%, order >=2 L1 0.31% (as the default), total L1 16.6%, at 2.94x the default wall time; on the pion total L1 31.2% at 2.54x."
cases = [
  "hybrid-basis-per-band/electron-100GeV",
  "hybrid-basis-per-band/pion-100GeV",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'hybrid-basis-per-band/*'"
inputs = ["bundle tables and electron; regenerated pion-100GeV"]
notes = [
  "src/lighthit/shower/api.py calls this 'the previous per-band route'.",
  """
NTSim's LightHitTransport calls exactly this for a shower when the event route is off or unavailable or an expert option is set (default PromptConfig, frequency_nodes=65).
""",
]

[code]
modules = ["lighthit.shower_basis", "lighthit._shower_basis"]
functions = [
  "TransportKernel.transport_hybrid",
  "shower_basis.transport_hybrid_basis",
  "shower_basis._transport_hybrid_spectral_basis",
]
options = [
  "ShowerBasis() defaults",
  """
transport_hybrid_basis(representation='basis'|'cells', track_stencil_center='axis'|'centroid')
""",
]
scripts = [
  "scripts/shower_basis_benchmark.py",
  "scripts/shower_basis/run_basis.py",
  "scripts/shower_basis/summarize_benchmark.py",
  "scripts/shower_basis/rows_markdown.py",
]
tests = ["tests/test_shower_route.py"]

