id = "stationary-fluence"
title = """
Stationary scalar-fluence maps of one photon: causal maxent ansatz, MC reference, fluence atlas
"""
area = "muon"
question = """
Can the stationary order >=2 fluence be modelled by a causal three-moment maximum-entropy ansatz or tabulated as a positive atlas?
"""
kind = "probe"
status = "rejected"
verdict = "Against an independent stationary MC, the causal three-moment maxent map has mass L1 0.51 of the total with median cell error 0.97 (95.5% of cells beyond 3 sigma), and the cache-based atlas differs by 0.308 m (0.357 of the mass) with median error 0.75 for cells with >= 100 counts."
cases = [
  "stationary-fluence/atlas",
  "stationary-fluence/causal-maxent",
  "stationary-fluence/mc",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'stationary-fluence/*'"
inputs = [
  "bundle 1 TeV muon (= the old muon1000.npz, sha256 e472ed6b...) and ancestry",
  """
regenerated 300 and 3000 GeV muons (same generator and seed as benchmark_long_muon.py generate; analyze_muon_secondaries.py --capture-source confirmed identical steps)
""",
]
notes = [
  """
No library code uses these maps; probe_fluence_atlas.py's optional cone-MC comparison needs a cone-histogram generator that is not in the repository.
""",
]
not_reproducible_parts = [
  "probe_fluence_atlas.py, optional cone-MC comparison: the cone-histogram generator it reads is not in the repository.",
]

[code]
modules = []
functions = []
options = []
scripts = [
  "scripts/shower_basis/probe_stationary_fluence_mc.py",
  "scripts/shower_basis/check_causal_fluence.py",
  "scripts/shower_basis/probe_fluence_atlas.py",
]
tests = []

