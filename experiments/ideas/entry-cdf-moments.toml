id = "entry-cdf-moments"
title = "First-entry arc CDF from eight universal depth moments"
area = "ballistic"
question = "Can a compact precomputed arc CDF remove the glass-entry event-time penalty without changing the numerical tolerance?"
kind = "alternative-option"
status = "rejected"
verdict = "The bounded eight-moment CDF is accurate and reduces bins by about 3-5% on three addressed OMs, but gives no demonstrated complete-event speedup: 15.31 s versus paired current entry 15.04-15.06 s and fast 10.21 s. It is not connected to production."
cases = ["entry-cdf-moments/arc-moments"]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'entry-cdf-moments/*'"
inputs = ["supplied cubic acceptance; dimensionless first-entry cap geometry, extinction and normalized arrival limit", "addressed event comparison uses the exact original electron-100GeV run-0 steps of photon-mc-matrix, 42194 steps and 27 active OMs"]
notes = [
  "This is the arc integral at fixed source point and wavelength. It is not a table of the whole spectral/source response of an OM. Eight universal depth moments replace angular quadrature; exact first-entry time cuts remain unchanged.",
  "The density is a bounded degree-seven polynomial in y=sqrt(1-u^2). Its CDF uses F_k(U)=integral_0^U (1-u^2)^(k/2) du, F_0=U, F_1=(asin(U)+U sqrt(1-U^2))/2, F_k=(k F_(k-2)+U (1-U^2)^(k/2))/(k+1). Full moments occupy 64 bytes. No geometry grid or interpolation is needed.",
  "The bound covers omitted angular/Jacobian powers, exponential remainders and curvature. A geometry failing the density tolerance keeps the original angular integral. A positive cubic acceptance is required; a nonpositive lower bound also selects the original integral. The factory is specific to its supplied polynomial.",
  "The addressed prototype reserves 1/64 of the existing relative error budget for the density approximation and subtracts that share from residual quadrature. It does not relax the original 2e-6 plus 1e-10 pe tolerance.",
  "OM 89 at 39.82 m: median bins 0.3193 s current versus 0.3039 s CDF over three short paired repeats. Further geometries: OM 267 at 25.02 m, 0.00555 -> 0.00537 s; OM 55 at 61.99 m, 0.3378 -> 0.3222 s. An initial array-coefficient implementation did not win and was replaced by scalar coefficients before the other geometries were tried.",
  "Complete warm 100 GeV electron, macOS, one thread: fast 10.2148 s; current glass entry 15.0568 s; CDF entry 15.3068 s; current entry repeated 15.0350 s. Bins are 3.4074 / 3.2611 / 3.5162 s in the three entry calls. Unchanged order-1 time varies between 5.51 and 5.96 s, so a small total-speed claim is not supported. The approximately 5 s gap to the fast route remains.",
  "Full-event charge and bin-L1 differences from current entry use at most 4.24e-8 of the existing tolerance. The active set, clocks, scattered components and >=2 spectrum are unchanged. The standard fast output stays bitwise equal to its saved response. No new photon MC events or matrix sweep were run.",
  "The residual still integrates source position and wavelength and splits their time crossings. Accelerating the inner CDF alone does not eliminate that work; a complete precomputed OM Green response was not established by this addressed test.",
]

