id = "shower-order1-element-method"
title = "Order 1 by uncompressed ring cones instead of grouped pencils"
area = "shower"
question = """
How far is the grouped order 1 from the 'ring' evaluation (every element as point cones, no grouping), and at what cost?
"""
kind = "alternative-option"
status = "tool"
verdict = "Uncompressed ring cones agree with the segment reference to order-1 bias +0.006%, L1 0.012% (electron) and -0.005%, L1 0.022% (pion), against the route's -0.50%/1.14% and -0.57%/10.6%, but cost 459x and 35x the route's wall time (5574 s and 715 s)."
baseline = "default-shower-route"
cases = [
  "shower-order1-element-method/electron-100GeV-ring",
  "shower-order1-element-method/pion-100GeV-ring",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'shower-order1-element-method/*'"
inputs = [
  "bundle Geant4 100 GeV electron (event 5)",
  "regenerated pion-100GeV",
  """
reference-shower/<input> (original-step orders 0+1, per-band order >=2, on the OMs of the default route)
""",
]
notes = [
  """
The reference uses element_method='segment' (original steps); ring is a second, independent control.
""",
]

[code]
modules = ["lighthit.prompt", "lighthit._prompt_numba"]
functions = []
options = ["PromptConfig.element_method='auto'|'grouped'|'segment'|'ring'"]
scripts = []
tests = []

