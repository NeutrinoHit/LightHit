id = "ntsim-hybrid-muon-fast"
title = """
NTSim expert hybrid muon run (check_muon_fast.sh): shower basis with track channel, muon-fast prompt screen, tolerances, optional muon components
"""
area = "muon"
question = """
The route NTSim used for muons before lighthit.muon (and the source of the old 'corrected' references): accuracy and cost against the muon reference.
"""
kind = "alternative-option"
status = "superseded-by:default-muon-route"
verdict = "Against reference-muon, NTSim's former hybrid muon run has order-0 L1 35.4% (1 TeV) and 28.2% (300 GeV) from the nine-node order 0, order-1 L1 0.72% and 1.20%, order >=2 L1 3.0-3.2% (300 GeV), at 8.6-11.2x (1 TeV) and 3.0-4.3x (300 GeV) the default wall time."
baseline = "default-muon-route"
cases = [
  "ntsim-hybrid-muon-fast/long-muon-300GeV",
  "ntsim-hybrid-muon-fast/muon-1TeV-all",
  "ntsim-hybrid-muon-fast/muon-1TeV-all-centroid",
  "ntsim-hybrid-muon-fast/muon-1TeV-all-polyline",
  "ntsim-hybrid-muon-fast/muon-1TeV-off",
  "ntsim-hybrid-muon-fast/muon-1TeV-prompt",
  "ntsim-hybrid-muon-fast/muon-300GeV-all",
  "ntsim-hybrid-muon-fast/muon-300GeV-all-centroid",
  "ntsim-hybrid-muon-fast/muon-300GeV-all-polyline",
  "ntsim-hybrid-muon-fast/muon-300GeV-off",
  "ntsim-hybrid-muon-fast/muon-300GeV-prompt",
  "ntsim-hybrid-muon-fast/prompt-screen-300GeV",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'ntsim-hybrid-muon-fast/*'"
inputs = [
  "bundle 1 TeV muon + ancestry",
  "regenerated 300 GeV muon (bit-identical regeneration checked on the 1 TeV event)",
  """
reference-muon/<input> (orders 0+1 of all original steps by the grouped per-band prompt without screen, order >=2 per band cloud-in-cell, on the OMs of the default route)
""",
]
notes = [
  """
Recomputed in LightHit on the same Geant4 event (NTSim reproduces the bundle muon bit for bit), with the calls of ntsim/LightTransport/LightHitTransport.py _transport.
""",
  """
Its outputs replace the deleted ntsim<E>-corrected, ntsim<E>-all and ntsim1000-all-centroid files read by several scripts (scripts/shower_basis/paths.py ntsim_hybrid_response).
""",
]

[code]
modules = [
  "lighthit.shower_basis",
  "lighthit.experimental.muon_components",
  "lighthit.prompt",
]
functions = []
options = [
  """
PromptConfig(screen_margin=6, batch_charge_tolerance_pe=1e-6); charge-only screening now uses the detailed source resolution (NTSim --hybrid-prompt-profile muon-fast)
""",
  "ShowerBasis(track_uid=0, spectral_fusion=True, apply_tolerance_pe=1e-6)",
  "frequency_nodes=33",
  """
--hybrid-muon-components off|prompt|all, --muon-track-stencil axis|centroid, hybrid_muon_primary_polyline
""",
]
scripts = [
  "scripts/shower_basis/benchmark_long_muon.py",
  "scripts/shower_basis/compare_long_muon.py",
  "scripts/shower_basis/probe_prompt_screen.py",
  "scripts/shower_basis/combine_prompt_control.py",
]
tests = []

