id = "muon-primary-q1-charge-gauss"
title = "Stationary primary order-1 charge by path Gauss order 6 vs the time integral"
area = "muon"
question = """
Effect of q1_charge_gauss_order=6 (MuonTransport) vs 0 (function default) on primary order 1.
"""
kind = "alternative-option"
status = "default"
verdict = "Path Gauss order 0 (the time integral) instead of 6 changes the primary order-1 charge by 1.9e-15 relative (1 TeV) and not at all (300 GeV), at 1.02x and 1.00x the default wall time."
baseline = "default-muon-route"
cases = [
  "muon-primary-q1-charge-gauss/muon-1TeV-order-0",
  "muon-primary-q1-charge-gauss/muon-300GeV-order-0",
]
how-to-run = "PYTHONPATH=src python experiments/run.py run 'muon-primary-q1-charge-gauss/*'"
inputs = [
  "bundle 1 TeV muon + ancestry",
  "regenerated 300 GeV muon (bit-identical regeneration checked on the 1 TeV event)",
  """
reference-muon/<input> (orders 0+1 of all original steps by the grouped per-band prompt without screen, order >=2 per band cloud-in-cell, on the OMs of the default route)
""",
]
notes = []

[code]
modules = ["lighthit.muon.universal_primary", "lighthit.muon.first_charge_only"]
functions = []
options = [
  "transport_universal_primary(q1_charge_gauss_order=6) in MuonTransport; default 0",
]
scripts = [
  "scripts/shower_basis/run_primary_charge_check.sh",
  "scripts/shower_basis/probe_stationary_path_gauss.py",
]
tests = ["tests/test_first_charge_only.py"]

